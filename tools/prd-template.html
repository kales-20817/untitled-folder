<title>Endpoint Central Reports PRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
  :root{
    --page:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7;
    --line:#dfe4ee; --line-soft:#e9edf4;
    --ink:#141a26; --ink-2:#43506a; --ink-3:#6d7a93;
    --accent:#2c66dd; --accent-soft:rgba(44,102,221,.09);
    --flag:#a55b09; --flag-bg:rgba(214,158,46,.12); --flag-line:rgba(214,158,46,.5);
    --decide:#7c4dbe; --decide-bg:rgba(124,77,190,.09); --decide-line:rgba(124,77,190,.42);
    --shadow:0 1px 2px rgba(20,26,38,.05), 0 8px 24px -18px rgba(20,26,38,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#0d1119; --surface:#141a25; --surface-2:#1a212e;
      --line:#242d3d; --line-soft:#1e2634;
      --ink:#e8ecf4; --ink-2:#a9b4c7; --ink-3:#7d8aa0;
      --accent:#7fa7f2; --accent-soft:rgba(127,167,242,.13);
      --flag:#e0ac52; --flag-bg:rgba(224,172,82,.11); --flag-line:rgba(224,172,82,.4);
      --decide:#b79cf0; --decide-bg:rgba(183,156,240,.11); --decide-line:rgba(183,156,240,.38);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --page:#0d1119; --surface:#141a25; --surface-2:#1a212e;
    --line:#242d3d; --line-soft:#1e2634;
    --ink:#e8ecf4; --ink-2:#a9b4c7; --ink-3:#7d8aa0;
    --accent:#7fa7f2; --accent-soft:rgba(127,167,242,.13);
    --flag:#e0ac52; --flag-bg:rgba(224,172,82,.11); --flag-line:rgba(224,172,82,.4);
    --decide:#b79cf0; --decide-bg:rgba(183,156,240,.11); --decide-line:rgba(183,156,240,.38);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  body{
    background:var(--page); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}

  .shell{max-width:1180px;margin:0 auto;padding:44px 24px 96px;display:grid;grid-template-columns:216px minmax(0,1fr);gap:56px;align-items:start}
  @media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr);gap:26px;padding-top:32px} }

  /* ---- contents rail ---- */
  nav.toc{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto}
  .toc-title{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;padding-left:12px;
  }
  nav.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  nav.toc a{
    display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:baseline;
    padding:5px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);
    font-size:13.5px;line-height:1.35;border-left:2px solid transparent;
  }
  nav.toc a:hover{background:var(--accent-soft);color:var(--ink)}
  nav.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
  .toc-num{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:11.5px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;
  }
  nav.toc a.on .toc-num{color:var(--accent)}
  @media (max-width:900px){
    nav.toc{position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
    nav.toc ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  }

  /* ---- document ---- */
  article{min-width:0}
  .doc-head{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:8px}
  .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);
  }
  h1{
    font-family:"Newsreader", Georgia, "Times New Roman", serif;font-weight:400;
    font-size:clamp(32px,4.6vw,46px);line-height:1.08;letter-spacing:-.015em;
    margin:12px 0 0;text-wrap:balance;
  }
  .doc-sub{color:var(--ink-2);font-size:16.5px;margin:8px 0 0;font-family:"Newsreader", Georgia, serif;font-style:italic}
  dl.meta{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;
    margin:26px 0 0;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .meta-row{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
  dl.meta dt{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);
  }
  dl.meta dd{margin:0;font-size:13.5px;color:var(--ink)}

  article h2{
    font-family:"Newsreader", Georgia, serif;font-weight:500;font-size:27px;letter-spacing:-.012em;
    line-height:1.2;margin:52px 0 14px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;gap:14px;align-items:baseline;scroll-margin-top:20px;text-wrap:balance;
  }
  article h3{
    font-size:16px;font-weight:600;letter-spacing:-.005em;margin:32px 0 10px;
    display:flex;gap:12px;align-items:baseline;scroll-margin-top:20px;
  }
  .sec-num{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:.62em;color:var(--ink-3);
    font-variant-numeric:tabular-nums;flex:none;padding-top:.15em;
  }
  article h4{font-size:14px;font-weight:600;margin:22px 0 8px}
  article p{margin:0 0 14px;max-width:72ch}
  article hr{display:none}

  article ul, article ol{margin:0 0 16px;padding-left:20px;max-width:74ch}
  article li{margin:0 0 7px}
  li.req{list-style:none;margin-left:-20px;padding-left:0;display:block}
  .req-id{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:11px;font-weight:500;
    color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 6px;
    margin-right:8px;white-space:nowrap;letter-spacing:.02em;
  }
  strong{font-weight:600}

  code{
    font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:12.5px;
    background:var(--surface-2);border-radius:4px;padding:1.5px 5px;
  }
  pre{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;overflow-x:auto;margin:0 0 18px;box-shadow:var(--shadow);
  }
  pre code{background:none;padding:0;font-size:12.5px;line-height:1.65;color:var(--ink-2)}

  .table-wrap{
    overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);box-shadow:var(--shadow);
  }
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:9px 14px;border-top:1px solid var(--line-soft);vertical-align:top}
  thead th{
    border-top:0;background:var(--surface-2);color:var(--ink-2);font-weight:600;
    font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  }
  tbody tr:hover{background:var(--accent-soft)}
  td:first-child{color:var(--ink);font-variant-numeric:tabular-nums}

  .note{
    display:block;margin:0 0 20px;padding:14px 18px;border-radius:10px;font-size:14px;
    background:var(--flag-bg);border:1px solid var(--flag-line);color:var(--ink);
  }
  .note p{margin:0 0 8px;max-width:none}
  .note p:last-child{margin:0}
  .note-tag{
    display:inline-block;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--flag);margin-bottom:6px;
  }
  .note--decision{background:var(--decide-bg);border-color:var(--decide-line)}
  .note--decision .note-tag{color:var(--decide)}
  blockquote.pull{
    margin:0 0 20px;padding:2px 0 2px 20px;border-left:2px solid var(--accent);
    font-family:"Newsreader", Georgia, serif;font-size:19px;font-style:italic;color:var(--ink-2);
  }
  blockquote.pull p{margin:0;max-width:60ch}

  footer{
    margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--ink-3);font-size:13px;
  }
  footer code{font-size:12px}
  a.back{text-decoration:none;font-weight:500}
  a.back:hover{text-decoration:underline}
</style>

    <header class="doc-head">
      <div class="eyebrow">Product requirements · draft for review</div>
      <h1>Reports &amp; Dashboards</h1>
      <p class="doc-sub"><!--SUBTITLE--></p>
      <dl class="meta">
<!--META-->
      </dl>
    </header>

<!--BODY-->

    <footer>
      Source: <code>PRD-Endpoint-Central-Reports.md</code> in <code>kales-20817/untitled-folder</code>.

</div>

<script>
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('nav.toc a'));
    var targets = links.map(function (a) { return document.getElementById(a.hash.slice(1)); });
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function () {
      var current = null;
      targets.forEach(function (t) {
        if (!t) return;
        if (t.getBoundingClientRect().top - 90 <= 0) current = t.id;
      });
      links.forEach(function (a) { a.classList.toggle('on', a.hash === '#' + current); });
    }, { rootMargin: '-80px 0px -70% 0px', threshold: [0, 1] });
    targets.forEach(function (t) { if (t) io.observe(t); });
  })();
</script>
