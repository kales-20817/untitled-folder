<meta charset="utf-8">
<title>Reports home, five behaviours · Endpoint Central</title>
<style>
  :root{
    --violet:#2563eb; --violet-hov:#1d4ed8; --violet-soft:rgba(37,99,235,.08);
    --surface:#fff; --surface-2:#f4f6fb; --surface-3:#eef2fa; --page:#f7f9fc;
    --border:rgba(37,99,235,.13); --border-soft:rgba(37,99,235,.07);
    --text:#15181e; --muted:#64748b; --faint:#94a3b8;
    --ok:#16a34a; --ok-bg:rgba(34,197,94,.12);
    --warn:#a16207; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.42);
    --err:#dc2626; --err-bg:rgba(239,68,68,.10); --err-line:rgba(239,68,68,.32);
    --sev4:#dc2626; --sev3:#ea580c; --sev2:#ca8a04; --sev1:#0891b2;
    --shadow:0 2px 12px rgba(37,99,235,.06); --pop:0 12px 34px rgba(16,25,42,.14);
    --r:12px; --font:'Zoho Puvi',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --sev4:#f87171; --sev3:#fb923c; --sev2:#facc15; --sev1:#22d3ee;
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --sev4:#f87171; --sev3:#fb923c; --sev2:#facc15; --sev1:#22d3ee;
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button,input{font-family:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .num{font-variant-numeric:tabular-nums}

  /* ══ switcher / pitch chrome ══ */
  .pitch{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border)}
  .pitch-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .pitch-t{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .pitch-t span{color:var(--muted);font-weight:500}
  .vtabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap}
  .vtabs button{padding:6px 12px;border:none;border-radius:7px;background:none;cursor:pointer;
                font:600 12.5px var(--font);color:var(--muted);transition:.14s;white-space:nowrap}
  .vtabs button:hover{color:var(--text)}
  .vtabs button.on{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}
  .why{display:flex;gap:20px;padding:9px 18px 11px;border-top:1px solid var(--border-soft);
       background:var(--surface-2);flex-wrap:wrap;font-size:12.5px;line-height:1.45}
  .why div{max-width:47ch}
  .why b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
         display:block;margin-bottom:2px;font-weight:700}
  .why .fix b{color:var(--violet)}

  .view{display:none}
  .view.on{display:block}

  .btn{padding:8px 14px;border-radius:8px;font:600 13px/1 var(--font);cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;text-decoration:none;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--violet);color:#fff} .btn.primary:hover{background:var(--violet-hov)}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--violet)}
  .btn.sm{padding:6px 11px;font-size:12px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;flex-shrink:0}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.bad{background:rgba(239,68,68,.14);color:var(--err)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

  /* ══ shared search-home primitives (reused across variants) ══ */
  .page{max-width:900px;margin:0 auto;padding:34px clamp(14px,3vw,30px) 70px}
  .kbd{font:600 11px var(--font);color:var(--muted);background:var(--surface-2);
       border:1px solid var(--border);border-radius:5px;padding:2.5px 7px;flex-shrink:0}
  .clr{background:none;border:none;color:var(--faint);cursor:pointer;padding:3px;border-radius:6px;line-height:0;flex-shrink:0}
  .clr:hover{color:var(--text);background:var(--surface-2)}

  .bigsearch-in{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--surface);
           border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);transition:.15s}
  .bigsearch-in:focus-within{border-color:var(--violet);box-shadow:0 0 0 5px var(--violet-soft)}
  .bigsearch-in svg{color:var(--muted);flex-shrink:0}
  .bigsearch-in input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);font-size:16px}
  .bigsearch-in input::placeholder{color:var(--faint)}

  .facets{display:flex;gap:7px;flex-wrap:wrap}
  .facet{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
         color:var(--muted);font:600 12.5px var(--font);cursor:pointer;transition:.13s;display:inline-flex;
         align-items:center;gap:6px;white-space:nowrap}
  .facet:hover{border-color:var(--violet);color:var(--text)}
  .facet.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .facet b{font-weight:700;opacity:.75;font-size:11.5px}

  .hitgroup{margin-bottom:18px}
  .hitgroup h3{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;color:var(--faint);
               text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .hitgroup h3 span{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px}
  .hits{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .hit{display:flex;align-items:center;gap:13px;padding:12px 15px;color:var(--text);
       border-bottom:1px solid var(--border-soft);transition:.12s;cursor:pointer}
  .hit:last-child{border-bottom:none}
  .hit:hover,.hit.cur{background:var(--violet-soft)}
  .hit .gi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
           background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .hit:hover .gi,.hit.cur .gi{background:var(--surface);color:var(--violet);border-color:var(--violet)}
  .hit .body{flex:1;min-width:0}
  .hit .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit .nm mark{background:none;color:var(--violet);font-weight:700}
  .hit .meta{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit .side{flex-shrink:0;display:flex;align-items:center;gap:8px}
  .hit .act{display:none;gap:6px}
  .hit:hover .act,.hit.cur .act{display:flex}

  .empty{padding:40px 20px;text-align:center;border:1px dashed var(--border);border-radius:var(--r);color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:6px}
  .empty p{margin:0 0 14px;font-size:13px;max-width:44ch;margin-inline:auto}
  .empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
        color:var(--text);font:500 12.5px var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .pill:hover{border-color:var(--violet);background:var(--violet-soft)}
  .pill svg{color:var(--faint);flex-shrink:0}

  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .cat{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;background:var(--surface);
       border:1px solid var(--border);transition:.15s;cursor:pointer;text-align:left}
  .cat:hover{border-color:var(--violet);background:var(--violet-soft)}
  .cat .gi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
           background:var(--surface-2);color:var(--muted);flex-shrink:0}
  .cat:hover .gi{background:var(--surface);color:var(--violet)}
  .cat .nm{font-weight:600;font-size:13px;line-height:1.25;display:block}
  .cat .n{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}

  .disc-sec{margin-bottom:24px}
  .disc-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
  .disc-h h2{font-size:13px;font-weight:700;margin:0}
  .disc-h .sp{flex:1}
  .stage{text-align:center;margin-bottom:24px}
  .stage .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
  .stage h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
  .stage .lede{font-size:14px;color:var(--muted);margin:0 auto;max-width:58ch}
  .bigsearch{max-width:640px;margin:0 auto}

  .note{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;
        background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--muted);margin-top:22px}
  .note svg{flex-shrink:0;margin-top:1px}

  /* ══ V2 · risk strip ══ */
  .sevstrip{display:flex;align-items:center;gap:18px;padding:14px 16px;border-radius:var(--r);
            background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:20px;flex-wrap:wrap}
  .sevstrip .sv-t{font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
  .sevstack{display:flex;height:9px;border-radius:999px;overflow:hidden;flex:1;min-width:120px;gap:2px}
  .sevstack span{display:block}
  .sevkeys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
  .sevkeys div{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .sevkeys i{width:8px;height:8px;border-radius:2.5px;flex-shrink:0}
  .sevkeys b{color:var(--text);font-weight:700}
  .riskchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;flex-shrink:0}

  /* ══ V3 · compliance ══ */
  .evidence-alert{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:var(--r);
                  background:var(--err-bg);border:1px solid var(--err-line);margin-bottom:20px}
  .evidence-alert .ico{width:32px;height:32px;border-radius:9px;background:rgba(239,68,68,.16);color:var(--err);
                        display:grid;place-items:center;flex-shrink:0}
  .evidence-alert b{font-size:13.5px} .evidence-alert p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .tagrow{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
  .tagchip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
           color:var(--muted);font:600 12px var(--font);cursor:pointer}
  .tagchip:hover{border-color:var(--violet);color:var(--text)}
  .tagchip.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .ev-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px}
  .ev-meta span{display:inline-flex;align-items:center;gap:4px}

  /* ══ V4 · command palette ══ */
  .cmdshell{background:#0b0d13;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;
            max-width:620px;margin:6vh auto 0;border:1px solid rgba(255,255,255,.08)}
  .cmdwrap{color:#e7e9ee;font:14px/1.5 var(--font)}
  .cmdin{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .cmdin svg{color:#6b7280;flex-shrink:0}
  .cmdin input{flex:1;background:none;border:none;outline:none;color:#f3f4f6;font:15px ui-monospace,'SF Mono',Menlo,monospace}
  .cmdin input::placeholder{color:#54596b}
  .cmdlegend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.08);
             font:11.5px ui-monospace,'SF Mono',Menlo,monospace;color:#6b7280}
  .cmdlegend b{color:#9ca8ff}
  .cmdlist{max-height:400px;overflow-y:auto;padding:6px}
  .cmdrow{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer}
  .cmdrow:hover,.cmdrow.cur{background:rgba(59,130,246,.16)}
  .cmdrow .gi{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.06);
              color:#8b93a7;flex-shrink:0}
  .cmdrow .t{flex:1;min-width:0;font:13.5px ui-monospace,'SF Mono',Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdrow .t mark{background:none;color:#93c5fd;font-weight:700}
  .cmdrow .meta{font:11px ui-monospace,'SF Mono',Menlo,monospace;color:#6b7280;flex-shrink:0}
  .cmdfoot{display:flex;gap:16px;padding:9px 18px;border-top:1px solid rgba(255,255,255,.08);
           font:11px ui-monospace,'SF Mono',Menlo,monospace;color:#6b7280}
  .cmdfoot span{display:flex;align-items:center;gap:5px}
  .cmdfoot .k{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;color:#c9cedb}
  .cmdempty{padding:30px 20px;text-align:center;color:#6b7280;font:13px var(--font)}

  /* ══ V5 · guided ══ */
  .askbox{max-width:640px;margin:0 auto}
  .askbox .bigsearch-in{border-radius:18px;padding:17px 19px}
  .ask-sparkle{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#2563eb);
               display:grid;place-items:center;flex-shrink:0;color:#fff}
  .starters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .starter{padding:9px 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
           color:var(--text);font:500 13px var(--font);cursor:pointer;box-shadow:var(--shadow)}
  .starter:hover{border-color:var(--violet);background:var(--violet-soft)}
  .plaingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .plaincat{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r);background:var(--surface);
            border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;text-align:left}
  .plaincat:hover{border-color:var(--violet)}
  .plaincat .gi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
  .plaincat .nm{font-weight:700;font-size:14px}
  .plaincat .n{font-size:12px;color:var(--muted)}
  .rescard{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:var(--r);background:var(--surface);
           border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:9px}
  .rescard .gi{width:38px;height:38px;border-radius:10px;background:var(--violet-soft);color:var(--violet);
               display:grid;place-items:center;flex-shrink:0}
  .rescard .body{flex:1;min-width:0}
  .rescard .nm{font-weight:700;font-size:14px}
  .rescard .d{font-size:12.5px;color:var(--muted);margin-top:2px}  /* ══ shared: behaviour label under the switcher ══ */
  .covers{font-size:11px;color:var(--faint);padding:0 18px 10px;margin-top:-4px}
  .covers b{color:var(--violet);font-weight:700}

  /* Base .hit was written for div rows, so it omits text-decoration and leaves
     .nm/.meta inline. These options use <a class="hit">, which needs both fixed. */
  a.hit{text-decoration:none}
  .hit .body{display:flex;flex-direction:column}
  .hit .nm,.hit .meta{display:block}
  /* Same trap anywhere a two-line row is built from sibling <span>s: without an
     explicit block, name and meta collapse onto one line. */
  .brow .body{display:flex;flex-direction:column;min-width:0}
  /* .sc children are [gi, text, rank] — the text block is nth-child(2), not last-child */
  .sc>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
  .brow .nm,.brow .meta,.sc .nm,.sc .why{display:block}

  /* ══ 1 · answer-first ══ */
  .ans{max-width:660px;margin:20px auto 0;background:var(--surface);border:1px solid var(--border);
       border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left}
  .ans-top{display:flex;align-items:flex-start;gap:16px;padding:18px 20px}
  .ans-v{font:700 40px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .ans-u{font-size:12.5px;color:var(--muted);margin-top:5px}
  .ans-body{flex:1;min-width:0}
  .ans-q{font-size:13px;color:var(--muted);margin-bottom:3px}
  .ans-h{font-size:15px;font-weight:700}
  .ans-delta{font-size:12px;font-weight:600;margin-top:4px}
  .ans-delta.up{color:var(--err)} .ans-delta.down{color:var(--ok)}
  .spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:8px}
  .spark i{flex:1;background:var(--violet-soft);border-radius:1px}
  .spark i:last-child{background:var(--violet)}
  .ans-src{display:flex;align-items:center;gap:9px;padding:10px 20px;background:var(--surface-2);
           border-top:1px solid var(--border-soft);font-size:12px;color:var(--muted);flex-wrap:wrap}
  .ans-src .sp{flex:1}
  .ans-src code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}

  /* ══ 2 · launchpad ══ */
  .lp{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:11px}
  .lpc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
       padding:13px 14px;text-decoration:none;color:inherit;display:block;position:relative;transition:.13s}
  .lpc:hover{border-color:var(--violet)}
  .lpc .t{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:18px}
  .lpc .v{font:700 27px/1.1 var(--font);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
  .lpc .d{font-size:11.5px;color:var(--faint);margin-top:3px}
  .lpc .pin{position:absolute;top:10px;right:10px;color:var(--violet);line-height:0}
  .strip{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--violet-soft);
         border:1px solid var(--border);border-radius:10px;font-size:12.5px;color:var(--text);margin-bottom:14px}
  .strip .sp{flex:1}

  /* ══ 3 · guided catalogue ══ */
  /* 320px min → 2×2 for the four starting points; at 196px the rationale text was
     crushed to ~93px by the icon and rank chip sharing the row. */
  .startrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-bottom:8px}
  .sc{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 13px;
      box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;gap:10px;align-items:flex-start}
  .sc:hover{border-color:var(--violet);background:var(--violet-soft)}
  .sc .gi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;

      '<div class="ans-src">' + I.info(13) + 'Answered from <b>' + E(a.src) + '</b> · ' + E(a.cat) +
      '<span class="sp"></span><a class="btn ghost sm" href="' + rowLink(a.src) + '">Open full report</a></div></div>';
  }
  function paint(){
    const v = q.value.trim().toLowerCase();
    clr.hidden = !v;
    if (!v){ out.innerHTML = ''; return; }
    const hit = ANSWERS.find(a => a.q.toLowerCase().includes(v) || a.src.toLowerCase().includes(v)
                              || v.split(/\s+/).filter(w=>w.length>3).some(w => a.q.toLowerCase().includes(w)));
    if (hit){ out.innerHTML = answer(hit); return; }
    const near = FLAT.filter(f => f.n.toLowerCase().includes(v)).slice(0,5);
    out.innerHTML = '<div class="empty" style="max-width:660px;margin:20px auto 0">' +
      '<b>No stored answer for that yet</b>' +
      '<p>Only six questions carry a precomputed answer in this mock. ' +
      (near.length ? 'These reports match the words you used:' : 'Nothing in the catalogue matches those words either.') + '</p>' +
      (near.length ? '<div class="hits" style="text-align:left">' + near.map(f =>
        '<a class="hit" href="' + rowLink(f.n) + '"><span class="gi">' + icoFor(f.cat) + '</span>' +
        '<span class="body"><span class="nm">' + E(f.n) + '</span><span class="meta">' + E(f.cat) + '</span></span></a>').join('') + '</div>' : '') +
      '</div>';
  }
  q.addEventListener('input', paint);
  clr.onclick = () => { q.value=''; paint(); q.focus(); };
  root.querySelectorAll('#o1sugg .pill').forEach(b => b.onclick = () => {
    q.value = ANSWERS[+b.dataset.i].q; paint(); q.focus(); });
  paint();
}

/* ═══════════════ 2 · Launchpad ═══════════════ */
function o2(){
  return '<div class="page">' +
    '<div class="strip">' + I.clock(14) + '<b>Monday, 08:12</b> — your pinned set last ran 20 minutes ago.' +
    '<span class="sp"></span><a class="btn ghost sm" href="#">Run all six</a></div>' +
    '<div class="disc-sec"><div class="disc-h"><h2>Pinned</h2><div class="sp" style="flex:1"></div>' +
    '<span style="font-size:12px;color:var(--muted)">values from the last run</span></div>' +
    '<div class="lp">' + PINS.map(p =>
      '<a class="lpc" href="' + rowLink(p.n) + '"><span class="pin">' + I.tag(13) + '</span>' +
      '<div class="t">' + E(p.n) + '</div><div class="v">' + E(p.v) + '</div>' +
      '<div class="d">' + E(p.d) + '</div></a>').join('') + '</div></div>' +
    '<div class="disc-sec"><div class="disc-h"><h2>You opened recently</h2></div>' +
    '<div class="hits">' + OPENED.map(o =>
      '<a class="hit" href="' + rowLink(o.n) + '"><span class="gi">' + icoFor(o.cat) + '</span>' +
      '<span class="body"><span class="nm">' + E(o.n) + '</span>' +
      '<span class="meta">' + E(o.cat) + '</span></span>' +
      '<span class="side" style="font-size:12px;color:var(--muted)">' + E(o.when) + '</span></a>').join('') + '</div></div>' +
    '<div class="disc-sec"><div class="disc-h"><h2>Everything else</h2></div>' +
    '<div class="pills"><a class="pill" href="reports-search-home.html">' + I.search(13) +
    'Search all ' + PREDEF_TOTAL + ' reports</a>' +
    '<a class="pill" href="reports-module-revamp.html">' + I.grid(13) + 'Browse the catalogue</a></div></div>' +
    '</div>';
}
function o2Wire(){}

/* ═══════════════ 3 · Guided catalogue ═══════════════ */
function o3(){
  return '<div class="page"><div class="stage" style="text-align:left;margin-bottom:22px">' +
    '<div class="eyebrow">Reports</div><h1 style="font-size:24px">' + PREDEF_TOTAL + ' reports across ' +
    CAT_KEYS.length + ' categories</h1>' +
    '<p class="lede" style="margin:0">You do not have to know the names. Start with what most teams open first, ' +
    'then widen into a category.</p></div>' +
    '<div class="disc-sec"><div class="disc-h"><h2>Start here</h2><div class="sp" style="flex:1"></div>' +
    '<span style="font-size:12px;color:var(--muted)">ranked, not alphabetical</span></div>' +
    '<div class="startrow">' + STARTHERE.map((s,i) =>
      '<a class="sc" href="' + rowLink(s.n) + '"><span class="gi">' + icoFor(s.cat) + '</span>' +
      '<span><span class="nm">' + E(s.n) + '</span><span class="why">' + E(s.why) + '</span></span>' +
      '<span class="rank">#' + (i+1) + '</span></a>').join('') + '</div></div>' +
    '<div class="disc-sec"><div class="disc-h"><h2>Browse by category</h2></div>' +
    '<div class="cgrid" id="o3grid"></div></div></div>';
}
function o3Wire(root){
  const grid = root.querySelector('#o3grid');
  const open = {};
  function paint(){
    grid.innerHTML = CAT_KEYS.map(c => {
      const list = CATALOG[c], show = open[c] ? list : list.slice(0,4);
      return '<div class="catcard2"><div class="ch"><span class="gi">' + icoFor(c) + '</span>' +
        '<h4>' + E(c.replace(/ Reports$/,'')) + '</h4><span class="n">' + list.length + '</span></div><ul>' +
        show.map(n => '<li><a href="' + rowLink(n) + '">' + E(n) + '</a></li>').join('') + '</ul>' +
        (list.length > 4 ? '<button class="more" data-c="' + E(c) + '">' +
          (open[c] ? 'Show fewer' : 'All ' + list.length + ' →') + '</button>' : '') + '</div>';
    }).join('');
    grid.querySelectorAll('.more').forEach(b => b.onclick = () => {
      open[b.dataset.c] = !open[b.dataset.c]; paint(); });
  }
  paint();
}

/* ═══════════════ 4 · Obligations board ═══════════════ */
function o4(){
  const bad = CUSTOM.filter(c => c.status === 'bad');
  const s = SCHEDULE[0];
  return '<div class="page"><div class="stage" style="text-align:left;margin-bottom:20px">' +
    '<div class="eyebrow">Reports</div><h1 style="font-size:24px">What is due, and what is broken</h1>' +
    '<p class="lede" style="margin:0">For the weeks when reporting is an obligation with a date on it, ' +
    'not a question you are curious about.</p></div>' +
    '<div class="board">' +
      '<div><div class="bcard" style="margin-bottom:14px"><h3>' + I.alert(14) +
        'Needs action now<span class="sp"></span><span class="c">' + (1 + bad.length) + '</span></h3>' +
        '<div class="brow alert"><span class="gi" style="width:30px;height:30px;border-radius:8px;display:grid;' +
          'place-items:center;background:var(--err-bg);color:var(--err);flex-shrink:0">' + I.cal(14) + '</span>' +
          '<span class="body"><span class="nm">' + E(s.n) + ' — delivery failed</span>' +
          '<span class="meta">' + E(s.freq) + ' → ' + E(s.to) + ' · next attempt ' + E(s.next) + '</span></span>' +
          '<a class="btn ghost sm" href="#">Fix</a></div>' +
        bad.map(c => '<div class="brow alert"><span class="gi" style="width:30px;height:30px;border-radius:8px;' +
          'display:grid;place-items:center;background:var(--err-bg);color:var(--err);flex-shrink:0">' + I.dash(14) + '</span>' +
          '<span class="body"><span class="nm">' + E(c.n) + ' — last run failed</span>' +
          '<span class="meta">Custom · ' + E(c.type) + ' · ' + E(c.when) + '</span></span>' +
          '<a class="btn ghost sm" href="#">Retry</a></div>').join('') +
      '</div>' +
      '<div class="bcard"><h3>' + I.cal(14) + 'Scheduled deliveries<span class="sp"></span>' +
        '<span class="c">1 configured</span></h3>' +
        '<div class="brow"><span class="body"><span class="nm">' + E(s.n) + '</span>' +
        '<span class="meta">' + E(s.freq) + ' · ' + E(s.to) + '</span></span>' +
        '<span class="badge bad">Failed</span></div>' +
        '<div class="brow"><span class="body"><span class="nm" style="color:var(--muted);font-weight:500">' +
        'Nothing else is scheduled</span><span class="meta">' + PREDEF_TOTAL +
        ' reports exist; one is automated</span></span>' +
        '<a class="btn primary sm" href="#">New schedule</a></div></div></div>' +

      '<div><div class="bcard" style="margin-bottom:14px"><h3>' + I.shieldCheck(14) +
        'Framework coverage<span class="sp"></span><span class="c">proposed</span></h3>' +
        FRAMEWORKS.map(f => '<div class="fw"><span class="nm">' + E(f.n) + '</span>' +
          '<span class="fwbar"><i style="width:' + Math.round(f.have/f.need*100) + '%"></i></span>' +
          '<span class="n">' + f.have + '/' + f.need + '</span></div>').join('') +
        '<div class="fw"><span class="meta gap" style="font-size:11.5px">' + I.info(12) +
        ' Framework tagging does not exist in the product yet</span></div></div>' +
      '<div class="bcard"><h3>' + I.box(14) + 'Estate health<span class="sp"></span></h3>' +
        '<div class="brow"><span class="body"><span class="nm">' + CUSTOM_TOTAL + ' custom reports</span>' +
        '<span class="meta">' + bad.length + ' failing · ' + DASHBOARD_TOTAL + ' custom dashboards</span></span></div>' +
        '<div class="brow"><span class="body"><span class="nm">' + QUERY_TOTAL + ' query reports</span>' +
        '<span class="meta">SQL-authored, no validation in the builder</span></span></div>' +
        '<div class="brow"><span class="body"><span class="nm">Retention</span>' +
        '<span class="meta">Set at list level — scope is ambiguous (PRD D7)</span></span></div></div></div>' +
    '</div></div>';
}
function o4Wire(){}

/* ═══════════════ 5 · Composer ═══════════════ */
function o5(){
  return '<div class="page"><div class="stage"><div class="eyebrow">Reports</div>' +
    '<h1>Nothing in the catalogue answers it</h1>' +
    '<p class="lede">Three ways in, sized by how they are actually used in this tenant — ' +
    'not by which one is newest.</p></div>' +
    '<div class="doors">' +
      '<button class="door" data-d="sql"><span class="gi">' + I.code(18) + '</span>' +
        '<h4>Express it</h4><p>Write the SQL expression directly. Full control over joins, ' +
        'filters and computed columns.</p>' +
        '<span class="use"><b>' + QUERY_TOTAL + ' query reports</b> exist — the most-used path</span></button>' +
      '<button class="door" data-d="build"><span class="gi">' + I.grid(18) + '</span>' +
        '<h4>Assemble it</h4><p>Pick a module, choose columns and a chart type. No expression ' +
        'language, but you decide every field.</p>' +
        '<span class="use"><b>' + CUSTOM_TOTAL + ' custom reports</b> built this way</span></button>' +
      '<button class="door" data-d="ai"><span class="gi">' + I.sparkle(18) + '</span>' +
        '<h4>Describe it</h4><p>Say what you want in a sentence and let ZIA propose the report, ' +
        'then adjust it.</p>' +
        '<span class="use">Newest path — <b>no adoption data yet</b></span></button>' +
    '</div>' +
    '<div id="o5out"></div>' +
    '<div class="disc-sec" style="margin-top:24px"><div class="disc-h"><h2>Or start from something that exists</h2>' +
    '<div class="sp" style="flex:1"></div><span style="font-size:12px;color:var(--muted)">' +
    'duplicate and edit</span></div><div class="hits">' +
    QUERY.slice(0,4).map(r => '<a class="hit" href="#"><span class="gi">' + I.code() + '</span>' +
      '<span class="body"><span class="nm">' + E(r.n) + '</span>' +
      '<span class="meta">Query report · ' + r.rows + ' rows · edited ' + E(r.when) + '</span></span>' +
      '<span class="side"><span class="btn ghost sm">Duplicate</span></span></a>').join('') +
    '</div></div></div>';
}
function o5Wire(root){
  const out = root.querySelector('#o5out');
  const PANES = {
    sql:{t:'Express it', b:'<div class="cmdshell" style="margin:0"><div class="cmdin" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)">SELECT resource_name, patch_count FROM …</div></div>' +
        '<p style="font-size:12.5px;color:var(--muted);margin:11px 0 0">No syntax highlighting, validation or result grid exists today (PRD GAP-10). That is the gap this door has to close.</p>'},
    build:{t:'Assemble it', b:'<p style="font-size:12.5px;color:var(--muted);margin:0">Module → columns → chart type → filters, as four ordered steps. Closest to what the prototype already builds.</p>'},
    ai:{t:'Describe it', b:'<p style="font-size:12.5px;color:var(--muted);margin:0">ZIA is fully simulated right now — four canned answers on a 2 s timer, cycling by index and ignoring your prompt entirely (PRD GAP-4). Presenting it as a peer to the other two overstates what it does.</p>'},
  };
  root.querySelectorAll('.door').forEach(b => b.onclick = () => {
    const p = PANES[b.dataset.d];
    root.querySelectorAll('.door').forEach(x => x.style.borderColor = '');
    b.style.borderColor = 'var(--violet)';
    out.innerHTML = '<div class="note" style="margin-top:16px;display:block"><b style="font-size:13px;' +
      'color:var(--text);display:block;margin-bottom:7px">' + p.t + '</b>' + p.b + '</div>';
  });
}

/* ═════════ mount / switcher ═════════ */
const VARIANTS = [
  { k:'o1', t:'1 · Answer-first', build:o1, wire:o1Wire, covers:'B1',
    who:'B1 — answering a one-off question. Arrives with a question in plain language and no idea which surface holds it.',
    fix:'Treats the report as the source and the number as the product: the value renders on this page, with the report named as provenance and a way through to the rows.',
    off:'Every answer has to be precomputed or the page lies. Six are stored here; anything else degrades to a name search. It also presumes the report viewer that does not exist yet (GAP-6, D6).' },
  { k:'o2', t:'2 · Launchpad', build:o2, wire:o2Wire, covers:'B2 + B4',
    who:'B2 and B4 — re-finding a known report, and the habitual Monday check. The answer is something they have already opened.',
    fix:'Pinned reports carry their last value, so the routine check needs no run and no search. Recently-opened sits under it; the 261-report catalogue is demoted to two links.',
    off:'Empty on day one and it entrenches habit — a better report they have never opened stays invisible. Needs the pinning and persistence the build lacks (GAP-2, D8).' },
  { k:'o3', t:'3 · Guided catalogue', build:o3, wire:o3Wire, covers:'B3',
    who:'B3 — exploring what exists, with no vocabulary yet. New tenant, or a new problem domain.',
    fix:'Leads with four ranked starting points rather than an alphabetical taxonomy, then lets each of the 14 categories expand in place so browsing never leaves the page.',
    off:'The ranking is asserted, not measured — there is no telemetry behind “most-opened”. Still a wall of names once expanded.' },
  { k:'o4', t:'4 · Obligations board', build:o4, wire:o4Wire, covers:'B5 + B7',
    who:'B5 and B7 — producing evidence someone else has demanded, and keeping the estate healthy.',
    fix:'Sorts by deadline and breakage instead of by name: the failing delivery is the first thing on the page, and framework coverage shows what evidence is missing rather than what reports exist.',
    off:'Framework tagging is invented — no such metadata exists today, and the card says so. The real scheduler is a stub (GAP-11), so the board would currently describe one automated report out of 261.' },
  { k:'o5', t:'5 · Composer', build:o5, wire:o5Wire, covers:'B6',
    who:'B6 — authoring something that does not exist. Three separate sub-behaviours by skill, not one.',
    fix:'Puts the three doors in the order the live data supports: SQL first (56 query reports), manual second (37 custom), AI last and explicitly unproven — rather than leading with the newest feature.',
    off:'Inverts the PRD’s G3 premise of “self-serve without SQL”. If the 56:37 split reflects an old power-user base rather than current demand, this ordering entrenches the wrong thing.' },
];

document.getElementById('vtabs').innerHTML = VARIANTS.map((v,i) =>
  '<button data-v="' + v.k + '"' + (i===0?' class="on"':'') + '>' + v.t + '</button>').join('');
document.getElementById('views').innerHTML = VARIANTS.map((v,i) =>
  '<div class="view' + (i===0?' on':'') + '" id="view-' + v.k + '"></div>').join('');

const built = {};
function show(k){
  VARIANTS.forEach(v => document.getElementById('view-'+v.k).classList.toggle('on', v.k===k));
  document.querySelectorAll('#vtabs button').forEach(b => b.classList.toggle('on', b.dataset.v===k));
  const v = VARIANTS.find(x => x.k===k);
  document.getElementById('why').innerHTML =
    '<div class="fix"><b>Behaviour it serves</b>' + v.who + ' ' + v.fix + '</div>' +
    '<div><b>Trade-off</b>' + v.off + '</div>';
  document.getElementById('covers').innerHTML = 'Covers <b>' + v.covers + '</b> of the seven behaviours';
  if (!built[k]){
    const root = document.getElementById('view-'+k);
    root.innerHTML = v.build();
    v.wire(root);
    built[k] = true;
  }
}
document.getElementById('vtabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) show(b.dataset.v);
});
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};
show('o1');
</script>
