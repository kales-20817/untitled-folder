<meta charset="utf-8">
<title>Settings search variations · Endpoint Central</title>
<style>
  :root {
    --violet:#2563eb; --violet-hov:#1d4ed8; --violet-soft:rgba(37,99,235,.08);
    --surface:#fff; --surface-2:#f4f6fb; --page:#f7f9fc;
    --border:rgba(37,99,235,.13); --border-soft:rgba(37,99,235,.07);
    --text:#15181e; --muted:#64748b; --faint:#94a3b8;
    --ok:#16a34a; --ok-bg:rgba(34,197,94,.12);
    --warn:#a16207; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.4);
    --err:#dc2626; --err-bg:rgba(239,68,68,.10); --err-line:rgba(239,68,68,.3);
    --shadow:0 2px 12px rgba(37,99,235,.06); --pop:0 10px 34px rgba(16,25,42,.14);
    --r:12px; --font:'Zoho Puvi',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.50); --faint:rgba(255,255,255,.34);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.32);
    --err:#f87171; --err-bg:rgba(239,68,68,.12); --err-line:rgba(239,68,68,.30);
    --shadow:none; --pop:0 10px 34px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.50); --faint:rgba(255,255,255,.34);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.32);
    --err:#f87171; --err-bg:rgba(239,68,68,.12); --err-line:rgba(239,68,68,.30);
    --shadow:none; --pop:0 10px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button,input{font-family:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .chrome{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;padding:9px 20px;
          background:var(--surface);border-bottom:1px solid var(--border)}
  .brand{font-weight:700;font-size:13px} .brand span{color:var(--muted);font-weight:500}
  .tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
  .tabs a{padding:6px 14px;border-radius:7px;text-decoration:none;font:600 13px var(--font);color:var(--muted)}
  .tabs a.on{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}
  .sp{flex:1}

  .btn{padding:8px 15px;border-radius:8px;font:600 13.5px/1 var(--font);cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;text-decoration:none;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--violet);color:#fff} .btn.primary:hover{background:var(--violet-hov)}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--violet)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}

  .page{max-width:960px;margin:0 auto;padding:40px clamp(14px,3vw,30px) 80px}

  /* ══ switcher / pitch chrome ══ */
  .pitch{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border)}
  .pitch-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .pitch-t{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .pitch-t span{color:var(--muted);font-weight:500}
  .vtabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap}
  .vtabs button{padding:6px 12px;border:none;border-radius:7px;background:none;cursor:pointer;
                font:600 12.5px var(--font);color:var(--muted)}
  .vtabs button:hover{color:var(--text)}
  .vtabs button.on{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}
  .why{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:0 18px 11px;font-size:12.5px;color:var(--muted)}
  .why b{display:block;font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;
         letter-spacing:.06em;margin-bottom:2px}
  .why .fix{border-right:1px solid var(--border-soft);padding-right:22px}
  @media (max-width:760px){ .why{grid-template-columns:1fr;gap:9px} .why .fix{border:none;padding:0} }

  .view{display:none} .view.on{display:block}

  /* ══ shared: the bar is the page ══ */
  .shell{min-height:calc(100vh - 118px);display:flex;flex-direction:column;align-items:center;
         padding:13vh 20px 40px;transition:padding-top .28s cubic-bezier(.4,0,.2,1)}
  .view.open .shell{padding-top:7vh}
  .hero{width:100%;max-width:640px;text-align:center}
  .hero .eyebrow{font-size:11.5px;font-weight:700;color:var(--violet);text-transform:uppercase;
                 letter-spacing:.08em;margin:0 0 10px}
  .hero h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 22px;text-wrap:balance}

  .searchwrap{position:relative;z-index:40}
  .bar{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--surface);
       border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);transition:.18s}
  .bar:focus-within{border-color:var(--violet);box-shadow:0 0 0 5px var(--violet-soft)}
  .view.open .bar{border-color:var(--violet);box-shadow:0 0 0 5px var(--violet-soft),var(--pop);
                  border-bottom-left-radius:0;border-bottom-right-radius:0}
  .bar>svg{color:var(--muted);flex-shrink:0}
  .bar input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);font-size:16px}
  .bar input::placeholder{color:var(--faint)}
  .clr{background:none;border:none;color:var(--faint);cursor:pointer;padding:3px;border-radius:6px;line-height:0;flex-shrink:0}
  .clr:hover{color:var(--text);background:var(--surface-2)}
  .kbd{font:600 11.5px var(--font);color:var(--muted);background:var(--surface-2);
       border:1px solid var(--border);border-radius:5px;padding:2.5px 7px;flex-shrink:0}

  .hint{margin:14px 0 0;font-size:12.5px;color:var(--faint);transition:opacity .2s}
  .view.open .hint{opacity:0;pointer-events:none}
  .hint b{color:var(--muted);font-weight:600}

  .panel{position:absolute;top:100%;left:0;right:0;text-align:left;background:var(--surface);
         border:1.5px solid var(--violet);border-top:none;border-radius:0 0 14px 14px;
         box-shadow:var(--pop);overflow:hidden;display:none}
  .view.open .panel{display:block}
  .panel-scroll{max-height:min(56vh,450px);overflow-y:auto;overscroll-behavior:contain}
  .panel-head{display:flex;align-items:center;gap:8px;padding:9px 15px;border-bottom:1px solid var(--border-soft);
              background:var(--surface-2)}
  .panel-head .t{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .panel-head .sp{flex:1} .panel-head .c{font-size:12px;color:var(--muted)}
  .back{background:none;border:none;cursor:pointer;color:var(--violet);font:600 12px var(--font);
        display:inline-flex;align-items:center;gap:5px;padding:2px 6px;margin-left:-6px;border-radius:6px}
  .back:hover{background:var(--violet-soft)}
  .sec{padding:7px 0} .sec+.sec{border-top:1px solid var(--border-soft)}
  .sec-t{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
         padding:6px 15px 5px;display:flex;align-items:center;gap:7px}
  .sec-t .n{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:11.5px}
  .sec-t .sp{flex:1}

  .row{display:flex;align-items:center;gap:12px;padding:9px 15px;text-decoration:none;color:var(--text);
       cursor:pointer;border:none;background:none;width:100%;text-align:left;font:inherit}
  .row:hover,.row.cur{background:var(--violet-soft)}
  .row .gi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
           background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .row:hover .gi,.row.cur .gi{background:var(--surface);color:var(--violet);border-color:var(--violet)}
  .row .body{flex:1;min-width:0;display:flex;flex-direction:column}
  /* NOTE: block, not flex — a flex .nm turns the <mark> and its sibling text nodes
     into separate flex items, which inserts the gap into the middle of a word. */
  .row .nm{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .nm mark{background:none;color:var(--violet);font-weight:700}
  .row .nm .badge{margin-left:7px;vertical-align:1px}
  .row .meta{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta code{font-size:11px;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .row .via{color:var(--violet)}
  .row .go{color:var(--faint);flex-shrink:0} .row:hover .go,.row.cur .go{color:var(--violet)}
  .row .cnt{font-size:11.5px;color:var(--faint);font-weight:600;flex-shrink:0}

  .badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-weight:600;flex-shrink:0}
  .badge.new{background:var(--warn-bg);color:var(--warn);font-size:10px;text-transform:uppercase;letter-spacing:.04em}

  .none{padding:26px 18px;text-align:center;color:var(--muted)}
  .none b{display:block;color:var(--text);font-size:13.5px;margin-bottom:5px}
  .none p{margin:0 0 12px;font-size:12.5px;max-width:40ch;margin-inline:auto}
  .none .try{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .chip{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
        color:var(--muted);font:600 11.5px var(--font);cursor:pointer}
  .chip:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}

  .panel-foot{display:flex;align-items:center;gap:8px;padding:8px 15px;border-top:1px solid var(--border-soft);
              background:var(--surface-2);font-size:11.5px;color:var(--faint)}
  .panel-foot .sp{flex:1}
  .panel-foot kbd{font:600 10.5px var(--font);background:var(--surface);border:1px solid var(--border);
                  border-radius:4px;padding:1.5px 5px;color:var(--muted)}
  .veil{position:fixed;inset:0;z-index:30;display:none} .view.open .veil{display:block}

  /* ══ A · intent rows ══ */
  .irow{align-items:flex-start}
  .irow .gi{background:var(--violet-soft);color:var(--violet);border-color:transparent}
  .irow .q{font-size:13.5px;font-weight:600}
  .irow .why2{font-size:11.5px;color:var(--muted);margin-top:1px}
  .irow .maps{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .irow .maps span{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);
                   border:1px solid var(--border);border-radius:999px;padding:1.5px 8px}

  /* ══ B · habit rows ══ */
  .pin{background:none;border:none;cursor:pointer;color:var(--faint);padding:4px;border-radius:6px;
       line-height:0;flex-shrink:0}
  .pin:hover{color:var(--violet);background:var(--surface-2)}
  .pin.on{color:var(--violet)}
  .freq{display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
  .freqbar{width:34px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
  .freqbar i{display:block;height:100%;background:var(--violet);border-radius:2px}
  .freq .num{font-size:11px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
  .rest{padding:9px 15px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;
        cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:inherit}
  .rest:hover{background:var(--violet-soft);color:var(--violet)}

  /* ══ C · two-pane browser ══ */
  /* 208px fits the longest category name ("Configuration Settings") without an ellipsis */
  .twopane{display:grid;grid-template-columns:208px 1fr;min-height:300px}
  .pane-l{border-right:1px solid var(--border-soft);background:var(--surface-2);
          max-height:min(56vh,450px);overflow-y:auto}
  .pane-r{max-height:min(56vh,450px);overflow-y:auto}
  .crow{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;border:none;background:none;
        width:100%;text-align:left;font:inherit;color:var(--muted);border-left:2px solid transparent}
  .crow:hover{background:var(--violet-soft);color:var(--text)}
  .crow.on{background:var(--surface);color:var(--violet);border-left-color:var(--violet);font-weight:600}
  .crow .nm2{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .cnt{font-size:11px;color:var(--faint);font-weight:600}
  @media (max-width:620px){ .twopane{grid-template-columns:1fr} .pane-l{max-height:150px;border-right:none;
                            border-bottom:1px solid var(--border-soft)} }
</style>

<div class="pitch">
  <div class="pitch-in">
    <div class="pitch-t">Settings search, three ways<span> · same 70 settings, three different habits</span></div>
    <div class="sp" style="flex:1"></div>
    <div class="vtabs" id="vtabs"></div>
    <button class="btn ghost sm" id="theme" title="Toggle theme" aria-label="Toggle theme">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
  <div class="why" id="why"></div>
</div>

<div id="views"></div>

/* ═══ scoring (shared) ═══ */
function score(it, q){
  const n = it.n.toLowerCase(), a = (it.alt||'').toLowerCase(), c = it.catName.toLowerCase();
  if (n === q) return {s:0};
  if (n.startsWith(q)) return {s:1};
  if (new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(n)) return {s:2};
  if (n.includes(q)) return {s:3};
  const w = a.split(/\s+/);
  const e = w.find(x => x === q);          if (e) return {s:4, via:e};
  const p = w.find(x => x.startsWith(q));  if (p) return {s:5, via:p};
  if (a.includes(q)) return {s:6, via:q};
  if (c.includes(q)) return {s:7, via:it.catName};
  return null;
}
function hl(name, q){
  const i = name.toLowerCase().indexOf(q);
  if (i < 0 || !q) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i,i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}
function search(q){
  const out = [];
  ITEMS.forEach(it => { const r = score(it,q); if (r) out.push({it, ...r}); });
  return out.sort((a,b) => a.s - b.s || a.it.n.localeCompare(b.it.n));
}
function settingRow(it, q, via, opts){
  opts = opts || {};
  const meta = via ? '<span class="via">matched “' + esc(via) + '”</span> · ' + esc(it.catName)
             : opts.hideCat ? '<code>' + esc(it.r) + '</code>'
                            : esc(it.catName) + ' · <code>' + esc(it.r) + '</code>';
  return '<a class="row" role="option" href="' + esc(href(it)) + '" target="_blank" rel="noopener">' +
    '<span class="gi">' + I[it.icon] + '</span>' +
    '<span class="body"><span class="nm">' + hl(it.n, q||'') +
      (it.nw ? '<span class="badge new">New</span>' : '') + '</span>' +
      '<span class="meta">' + meta + '</span></span>' +
    (opts.right || '') + '<span class="go">' + I.go + '</span></a>';
}
function resultsPanel(q, foot){
  const scored = search(q);
  if (!scored.length){
    return '<div class="none"><b>Nothing matches “' + esc(q) + '”</b>' +
      '<p>Try what you want to change rather than its label.</p><div class="try">' +
      ['smtp','sso','gdpr','disk space'].map(t => '<button class="chip" data-q="' + t + '">' + t + '</button>').join('') +
      '</div></div>' + foot;
  }
  const groups = [];
  scored.forEach(s => { let g = groups.find(x => x.id === s.it.cat);
    if (!g){ g = {id:s.it.cat, name:s.it.catName, rows:[]}; groups.push(g); } g.rows.push(s); });
  const direct = scored.filter(s => s.s <= 3).length, syn = scored.length - direct;
  let h = '<div class="panel-head"><span class="t">' + scored.length + ' result' + (scored.length>1?'s':'') +
          '</span><span class="sp"></span><span class="c">' + direct + ' by name' +
          (syn ? ' · ' + syn + ' by synonym' : '') + '</span></div><div class="panel-scroll">';
  groups.forEach(g => h += '<div class="sec"><div class="sec-t">' + esc(g.name) +
    ' <span class="n">' + g.rows.length + '</span></div>' +
    g.rows.map(s => settingRow(s.it, q, s.via)).join('') + '</div>');
  return h + '</div>' + foot;
}
const foot = extra => '<div class="panel-foot"><kbd>↑↓</kbd> move <kbd>↵</kbd> open <kbd>esc</kbd> close' +
  '<span class="sp"></span>' + (extra || TOTAL + ' settings · ' + CATS.length + ' categories') + '</div>';

function stage(k, o){

function wire(root, k, render){
  const view = root, q = root.querySelector('#' + k + 'q'), panel = root.querySelector('#' + k + 'panel');
  const clr = root.querySelector('[data-clr]'), veil = root.querySelector('[data-veil]');
  const st = {q:'', cur:-1, open:false, cat:null, expanded:false};
  const rows = () => [...panel.querySelectorAll('.row,.crow,.rest')];

  function mark(){ const l = rows(); l.forEach((r,i) => r.classList.toggle('cur', i === st.cur));
                   if (st.cur >= 0) l[st.cur]?.scrollIntoView({block:'nearest'}); }
  function paint(){
    clr.hidden = !st.q;
    if (!st.open) return;
    panel.innerHTML = render(st);
    panel.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
      st.q = b.dataset.q; q.value = b.dataset.q; st.cur = -1; paint(); q.focus(); });
    panel.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      st.cat = b.dataset.cat; st.cur = -1; paint(); q.focus(); });
    panel.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
      st.cat = null; st.cur = -1; paint(); q.focus(); });
    panel.querySelectorAll('[data-expand]').forEach(b => b.onclick = () => {
      st.expanded = true; st.cur = -1; paint(); q.focus(); });
    panel.querySelectorAll('[data-pin]').forEach(b => b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      const n = b.dataset.pin, i = PINNED.indexOf(n);
      i < 0 ? PINNED.push(n) : PINNED.splice(i,1);
      paint(); });
    mark();
  }
  function open(){ if (st.open) return; st.open = true; view.classList.add('open');
                   q.setAttribute('aria-expanded','true'); paint(); }
  function close(){ st.open = false; st.cur = -1; st.cat = null; st.expanded = false;
                    view.classList.remove('open'); q.setAttribute('aria-expanded','false'); }

  q.addEventListener('focus', open);
  q.addEventListener('click', open);
  q.addEventListener('input', e => { st.q = e.target.value; st.cat = null; st.cur = -1; open(); paint(); });
  clr.onclick = () => { st.q = ''; q.value = ''; st.cur = -1; paint(); q.focus(); };
  veil.onclick = () => { close(); q.blur(); };

  root.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if (st.cat){ st.cat = null; paint(); return; }
      if (st.q){ st.q = ''; q.value = ''; paint(); return; }
      close(); q.blur(); return;
    }
    if (!st.open) return;
    const l = rows(); if (!l.length) return;
    if (e.key === 'ArrowDown'){ e.preventDefault(); st.cur = Math.min(st.cur+1, l.length-1); mark(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); st.cur = Math.max(st.cur-1, 0); mark(); }
    if (e.key === 'Enter' && st.cur >= 0){ e.preventDefault(); l[st.cur].click(); }
  });
  return {focus:() => q.focus(), q};
}

  { k:'b', t:'B · Habit-led', build:b, panel:bPanel,
    who:'The daily operator — same handful of settings, week after week.',
    fix:'Assumes the answer is something they have already opened: pinned first, then usage-ranked with visible counts, so the common case is zero typing. Search is demoted to a row at the bottom.',
    off:'Useless on day one — a new admin sees an empty pinned list and no history. It also entrenches habit: a better setting they have never opened stays buried.' },
  { k:'c', t:'C · Structure-led', build:c, panel:cPanel,
    who:'The power user who already knows the product map and navigates by position.',
    fix:'Mirrors the real Admin page: 14 categories on the left, settings on the right, fully keyboard-traversable. Nothing is hidden behind a query you have to guess.',
    off:'Rewards existing knowledge and teaches none — if you do not know Endpoint Central calls SMTP “Mail Server”, the structure will not tell you. Widest panel of the three.' },
];

document.getElementById('vtabs').innerHTML = VARIANTS.map((v,i) =>
  '<button data-v="' + v.k + '"' + (i===0?' class="on"':'') + '>' + v.t + '</button>').join('');
document.getElementById('views').innerHTML = VARIANTS.map((v,i) =>
  '<div class="view' + (i===0?' on':'') + '" id="view-' + v.k + '"></div>').join('');

const built = {};
function show(k){
  VARIANTS.forEach(v => document.getElementById('view-'+v.k).classList.toggle('on', v.k===k));
  document.querySelectorAll('#vtabs button').forEach(b => b.classList.toggle('on', b.dataset.v===k));
  const v = VARIANTS.find(x => x.k===k);
  document.getElementById('why').innerHTML =
    '<div class="fix"><b>Behaviour it assumes</b>' + v.who + ' ' + v.fix + '</div>' +
    '<div><b>Trade-off</b>' + v.off + '</div>';
  if (!built[k]){
    const root = document.getElementById('view-'+k);
    root.innerHTML = v.build();
    built[k] = wire(root, k, v.panel);
  }
}
document.getElementById('vtabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) show(b.dataset.v);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    const on = VARIANTS.find(v => document.getElementById('view-'+v.k).classList.contains('on'));
    built[on.k]?.focus();
  }
});
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};
show('a');
</script>
