<meta charset="utf-8">
<title>Search Reports, Five Ways</title>
<style>
  :root{
    --violet:#2563eb; --violet-hov:#1d4ed8; --violet-soft:rgba(37,99,235,.08);
    --surface:#fff; --surface-2:#f4f6fb; --surface-3:#eef2fa; --page:#f7f9fc;
    --border:rgba(37,99,235,.13); --border-soft:rgba(37,99,235,.07);
    --text:#15181e; --muted:#64748b; --faint:#94a3b8;
    --ok:#16a34a; --ok-bg:rgba(34,197,94,.12);
    --warn:#a16207; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.42);
    --err:#dc2626; --err-bg:rgba(239,68,68,.10); --err-line:rgba(239,68,68,.32);
    --sev4:#dc2626; --sev3:#ea580c; --sev2:#ca8a04; --sev1:#0891b2;
    --shadow:0 2px 12px rgba(37,99,235,.06); --pop:0 12px 34px rgba(16,25,42,.14);
    --r:12px; --font:'Zoho Puvi',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --sev4:#f87171; --sev3:#fb923c; --sev2:#facc15; --sev1:#22d3ee;
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --sev4:#f87171; --sev3:#fb923c; --sev2:#facc15; --sev1:#22d3ee;
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button,input{font-family:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .num{font-variant-numeric:tabular-nums}

  /* ══ switcher / pitch chrome ══ */
  .pitch{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border)}
  .pitch-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .pitch-t{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .pitch-t span{color:var(--muted);font-weight:500}
  .vtabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap}
  .vtabs button{padding:6px 12px;border:none;border-radius:7px;background:none;cursor:pointer;
                font:600 12.5px var(--font);color:var(--muted);transition:.14s;white-space:nowrap}
  .vtabs button:hover{color:var(--text)}
  .vtabs button.on{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}
  .why{display:flex;gap:20px;padding:9px 18px 11px;border-top:1px solid var(--border-soft);
       background:var(--surface-2);flex-wrap:wrap;font-size:12.5px;line-height:1.45}
  .why div{max-width:47ch}
  .why b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
         display:block;margin-bottom:2px;font-weight:700}
  .why .fix b{color:var(--violet)}

  .view{display:none}
  .view.on{display:block}

  .btn{padding:8px 14px;border-radius:8px;font:600 13px/1 var(--font);cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;text-decoration:none;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--violet);color:#fff} .btn.primary:hover{background:var(--violet-hov)}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--violet)}
  .btn.sm{padding:6px 11px;font-size:12px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;flex-shrink:0}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.bad{background:rgba(239,68,68,.14);color:var(--err)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

  /* ══ shared search-home primitives (reused across variants) ══ */
  .page{max-width:900px;margin:0 auto;padding:34px clamp(14px,3vw,30px) 70px}
  .kbd{font:600 11px var(--font);color:var(--muted);background:var(--surface-2);
       border:1px solid var(--border);border-radius:5px;padding:2.5px 7px;flex-shrink:0}
  .clr{background:none;border:none;color:var(--faint);cursor:pointer;padding:3px;border-radius:6px;line-height:0;flex-shrink:0}
  .clr:hover{color:var(--text);background:var(--surface-2)}

  .bigsearch-in{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--surface);
           border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);transition:.15s}
  .bigsearch-in:focus-within{border-color:var(--violet);box-shadow:0 0 0 5px var(--violet-soft)}
  .bigsearch-in svg{color:var(--muted);flex-shrink:0}
  .bigsearch-in input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);font-size:16px}
  .bigsearch-in input::placeholder{color:var(--faint)}

  .facets{display:flex;gap:7px;flex-wrap:wrap}
  .facet{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
         color:var(--muted);font:600 12.5px var(--font);cursor:pointer;transition:.13s;display:inline-flex;
         align-items:center;gap:6px;white-space:nowrap}
  .facet:hover{border-color:var(--violet);color:var(--text)}
  .facet.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .facet b{font-weight:700;opacity:.75;font-size:11.5px}

  .hitgroup{margin-bottom:18px}
  .hitgroup h3{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;color:var(--faint);
               text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .hitgroup h3 span{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px}
  .hits{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .hit{display:flex;align-items:center;gap:13px;padding:12px 15px;color:var(--text);
       border-bottom:1px solid var(--border-soft);transition:.12s;cursor:pointer}
  .hit:last-child{border-bottom:none}
  .hit:hover,.hit.cur{background:var(--violet-soft)}
  .hit .gi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
           background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .hit:hover .gi,.hit.cur .gi{background:var(--surface);color:var(--violet);border-color:var(--violet)}
  .hit .body{flex:1;min-width:0}
  .hit .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit .nm mark{background:none;color:var(--violet);font-weight:700}
  .hit .meta{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit .side{flex-shrink:0;display:flex;align-items:center;gap:8px}
  .hit .act{display:none;gap:6px}
  .hit:hover .act,.hit.cur .act{display:flex}

  .empty{padding:40px 20px;text-align:center;border:1px dashed var(--border);border-radius:var(--r);color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:6px}
  .empty p{margin:0 0 14px;font-size:13px;max-width:44ch;margin-inline:auto}
  .empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
        color:var(--text);font:500 12.5px var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .pill:hover{border-color:var(--violet);background:var(--violet-soft)}
  .pill svg{color:var(--faint);flex-shrink:0}

  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .cat{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;background:var(--surface);
       border:1px solid var(--border);transition:.15s;cursor:pointer;text-align:left}
  .cat:hover{border-color:var(--violet);background:var(--violet-soft)}
  .cat .gi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
           background:var(--surface-2);color:var(--muted);flex-shrink:0}
  .cat:hover .gi{background:var(--surface);color:var(--violet)}
  .cat .nm{font-weight:600;font-size:13px;line-height:1.25;display:block}
  .cat .n{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}

  .disc-sec{margin-bottom:24px}
  .disc-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
  .disc-h h2{font-size:13px;font-weight:700;margin:0}
  .disc-h .sp{flex:1}
  .stage{text-align:center;margin-bottom:24px}
  .stage .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
  .stage h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
  .stage .lede{font-size:14px;color:var(--muted);margin:0 auto;max-width:58ch}
  .bigsearch{max-width:640px;margin:0 auto}

  .note{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;
        background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--muted);margin-top:22px}
  .note svg{flex-shrink:0;margin-top:1px}

  /* ══ V2 · risk strip ══ */
  .sevstrip{display:flex;align-items:center;gap:18px;padding:14px 16px;border-radius:var(--r);
            background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:20px;flex-wrap:wrap}
  .sevstrip .sv-t{font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
  .sevstack{display:flex;height:9px;border-radius:999px;overflow:hidden;flex:1;min-width:120px;gap:2px}
  .sevstack span{display:block}
  .sevkeys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
  .sevkeys div{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .sevkeys i{width:8px;height:8px;border-radius:2.5px;flex-shrink:0}
  .sevkeys b{color:var(--text);font-weight:700}
  .riskchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;flex-shrink:0}

  /* ══ V3 · compliance ══ */
  .evidence-alert{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:var(--r);
                  background:var(--err-bg);border:1px solid var(--err-line);margin-bottom:20px}
  .evidence-alert .ico{width:32px;height:32px;border-radius:9px;background:rgba(239,68,68,.16);color:var(--err);
                        display:grid;place-items:center;flex-shrink:0}
  .evidence-alert b{font-size:13.5px} .evidence-alert p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .tagrow{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
  .tagchip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
           color:var(--muted);font:600 12px var(--font);cursor:pointer}
  .tagchip:hover{border-color:var(--violet);color:var(--text)}
  .tagchip.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .ev-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px}
  .ev-meta span{display:inline-flex;align-items:center;gap:4px}

  /* ══ V4 · command palette ══ */
  .cmdshell{background:#0b0d13;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;
            max-width:620px;margin:6vh auto 0;border:1px solid rgba(255,255,255,.08)}
  .cmdwrap{color:#e7e9ee;font:14px/1.5 var(--font)}
  .cmdin{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .cmdin svg{color:#6b7280;flex-shrink:0}
  .cmdin input{flex:1;background:none;border:none;outline:none;color:#f3f4f6;font:15px ui-monospace,'SF Mono',Menlo,monospace}
  .cmdin input::placeholder{color:#54596b}
  .cmdlegend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.08);
             font:11.5px ui-monospace,'SF Mono',Menlo,monospace;color:#6b7280}
  .cmdlegend b{color:#9ca8ff}
  .cmdlist{max-height:400px;overflow-y:auto;padding:6px}
  .cmdrow{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer}
  .cmdrow:hover,.cmdrow.cur{background:rgba(59,130,246,.16)}
  .cmdrow .gi{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.06);
              color:#8b93a7;flex-shrink:0}
  .cmdrow .t{flex:1;min-width:0;font:13.5px ui-monospace,'SF Mono',Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmdrow .t mark{background:none;color:#93c5fd;font-weight:700}
  .cmdrow .meta{font:11px ui-monospace,'SF Mono',Menlo,monospace;color:#6b7280;flex-shrink:0}
  .cmdfoot{display:flex;gap:16px;padding:9px 18px;border-top:1px solid rgba(255,255,255,.08);
           font:11px ui-monospace,'SF Mono',Menlo,monospace;color:#6b7280}
  .cmdfoot span{display:flex;align-items:center;gap:5px}
  .cmdfoot .k{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;color:#c9cedb}
  .cmdempty{padding:30px 20px;text-align:center;color:#6b7280;font:13px var(--font)}

  /* ══ V5 · guided ══ */
  .askbox{max-width:640px;margin:0 auto}
  .askbox .bigsearch-in{border-radius:18px;padding:17px 19px}
  .ask-sparkle{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#2563eb);
               display:grid;place-items:center;flex-shrink:0;color:#fff}
  .starters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .starter{padding:9px 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
           color:var(--text);font:500 13px var(--font);cursor:pointer;box-shadow:var(--shadow)}
  .starter:hover{border-color:var(--violet);background:var(--violet-soft)}
  .plaingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .plaincat{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r);background:var(--surface);
            border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;text-align:left}
  .plaincat:hover{border-color:var(--violet)}
  .plaincat .gi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
  .plaincat .nm{font-weight:700;font-size:14px}
  .plaincat .n{font-size:12px;color:var(--muted)}
  .rescard{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:var(--r);background:var(--surface);
           border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:9px}
  .rescard .gi{width:38px;height:38px;border-radius:10px;background:var(--violet-soft);color:var(--violet);
               display:grid;place-items:center;flex-shrink:0}
  .rescard .body{flex:1;min-width:0}
  .rescard .nm{font-weight:700;font-size:14px}
  .rescard .d{font-size:12.5px;color:var(--muted);margin-top:2px}
</style>

<div class="pitch">
  <div class="pitch-in">
    <div class="pitch-t">Search Reports, five ways<span> · same index, five different jobs</span></div>
    <div class="sp" style="flex:1"></div>
    <div class="vtabs" id="vtabs"></div>
  </div>
  <div class="why" id="why"></div>
</div>

<div id="views"></div>

<script>
function E(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
const MODULE = 'reports-module-revamp.html';
const svg = (p,s=15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  search:()=>svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',18),
  clock:()=>svg('<circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/>'),
  x:()=>svg('<path d="M18 6 6 18M6 6l12 12"/>',16),
  grid:()=>svg('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'),
  code:()=>svg('<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>'),
  cal:()=>svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  dash:()=>svg('<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'),
  user:()=>svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  pc:()=>svg('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  grp:()=>svg('<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><path d="M17 5.2a3.5 3.5 0 0 1 0 5.6M19 20a6 6 0 0 0-3-5.2"/>'),
  tree:()=>svg('<rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-3h14v3"/>'),
  globe:()=>svg('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>'),
  shield:()=>svg('<path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/>'),
  shieldCheck:()=>svg('<path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/>'),
  login:()=>svg('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>'),
  power:()=>svg('<path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"/>'),
  box:()=>svg('<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),
  usb:()=>svg('<circle cx="12" cy="20" r="2"/><path d="M12 18V7M9 10 12 7l3 3M8 14h8"/>'),
  lock:()=>svg('<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>'),
  bug:()=>svg('<rect x="8" y="6" width="8" height="13" rx="4"/><path d="M8 11H4M20 11h-4M8 16H4M20 16h-4M9 6 7.5 3.5M15 6l1.5-2.5"/>'),

function highlight(name, q){
  if(!q) return E(name);
  const i = name.toLowerCase().indexOf(q);
  if(i<0) return E(name);
  return E(name.slice(0,i)) + '<mark>' + E(name.slice(i,i+q.length)) + '</mark>' + E(name.slice(i+q.length));
}

/* ═══════════════════════════ V1 · everyday admin ═══════════════════════════ */
function v1(){
  return `<div class="page">
    <div class="stage">
      <div class="eyebrow" style="color:var(--violet)">REPORTS</div>
      <h1>Find any report, dashboard or schedule</h1>
      <p class="lede">One search across predefined reports, custom reports, saved queries and delivery schedules — no need to know which module it lives in.</p>
      <div class="bigsearch">
        <div class="bigsearch-in">${I.search()}
          <input id="v1q" placeholder="Search 261 predefined reports, 37 custom reports, 56 queries…" autocomplete="off">
          <button class="clr" id="v1clr" hidden>${I.x()}</button>
          <span class="kbd">/</span>
        </div>
      </div>
      <div class="facets" id="v1facets" style="justify-content:center;margin-top:14px"></div>
    </div>
    <div id="v1results"></div>
  </div>`;
}
function v1Wire(root){
  let activeFacet='all';
  const FACETS = [
    { k:'all', l:'All', n:PREDEF_TOTAL+CUSTOM_TOTAL+QUERY_TOTAL+SCHEDULE.length+DASHBOARD_TOTAL },
    { k:'predefined', l:'Predefined', n:PREDEF_TOTAL },
    { k:'custom', l:'Custom reports', n:CUSTOM_TOTAL },
    { k:'query', l:'Query reports', n:QUERY_TOTAL },
    { k:'schedule', l:'Schedules', n:SCHEDULE.length },
    { k:'dashboard', l:'Dashboards', n:DASHBOARD_TOTAL },
  ];
  const q = root.querySelector('#v1q'), clr = root.querySelector('#v1clr');
  const facetsEl = root.querySelector('#v1facets'), resEl = root.querySelector('#v1results');

  function hitRow(h, qs){
    const badge = h.kind==='custom' ? (h.status==='ok' ? '<span class="badge ok"><span class="dot"></span>Active</span>' : '<span class="badge bad"><span class="dot"></span>Error</span>')
      : h.kind==='schedule' ? (h.bad ? '<span class="badge bad"><span class="dot"></span>Delivery failing</span>' : '<span class="badge ok"><span class="dot"></span>Scheduled</span>')
      : h.kind==='query' ? `<span class="badge neu">${E(h.when)}</span>` : '';
    const actions = h.kind==='predefined'
      ? `<div class="act"><a class="btn ghost sm" href="${MODULE}">Preview</a><a class="btn primary sm" href="${MODULE}">Run</a></div>`
      : `<div class="act"><a class="btn ghost sm" href="${MODULE}">Open</a></div>`;
    return `<div class="hit" data-kind="${h.kind}">
      <span class="gi">${h.ico()}</span>
      <span class="body"><span class="nm">${highlight(h.n,qs)}</span><span class="meta">${E(h.cat)}</span></span>
      <span class="side">${badge}${actions}</span>
    </div>`;
  }
  function renderFacets(counts){
    facetsEl.innerHTML = FACETS.map(f=>{
      const n = counts ? (counts[f.k]??0) : f.n;
      return `<button class="facet ${activeFacet===f.k?'on':''}" data-k="${f.k}">${E(f.l)} <b>${n}</b></button>`;
    }).join('');
    facetsEl.querySelectorAll('.facet').forEach(b=>b.onclick=()=>{activeFacet=b.dataset.k;render();});
  }
  function discovery(){
    resEl.innerHTML = `
      <div class="disc-sec"><div class="disc-h"><h2>Recent searches</h2></div><div class="pills" id="v1recent"></div></div>
      <div class="disc-sec"><div class="disc-h"><h2>Popular this week</h2></div><div class="hits" id="v1pop"></div></div>
      <div class="disc-sec"><div class="disc-h"><h2>Browse by category</h2><div class="sp" style="flex:1"></div><span style="font-size:12px;color:var(--muted)">${PREDEF_TOTAL} predefined reports</span></div>
        <div class="cgrid" id="v1cats"></div></div>`;
    root.querySelector('#v1recent').innerHTML = ['bitlocker','missing patches','logon','usb','co2 emission'].map(t=>
      `<button class="pill" data-q="${E(t)}">${I.clock()}${E(t)}</button>`).join('');
    root.querySelectorAll('#v1recent .pill').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;render();});
    const POPULAR = [['Missing Patches','Threats & Patches Reports',142],['All Computers','Computer Reports',98],['License Compliance','Inventory Reports',76],['Bitlocker Details','Inventory Reports',54]];
    root.querySelector('#v1pop').innerHTML = POPULAR.map(([n,cat,runs])=>`<div class="hit" style="cursor:default">
      <span class="gi">${(ICO_FOR_CAT[cat]||I.grid)()}</span>
      <span class="body"><span class="nm">${E(n)}</span><span class="meta">${E(cat)}</span></span>
      <span class="side"><span class="badge neu">${runs} runs</span></span></div>`).join('');
    const STAR = ['Threats & Patches Reports','Inventory Reports','User Reports','Computer Reports','MDM Reports','Application Control Reports'];
    root.querySelector('#v1cats').innerHTML = STAR.map(c=>`<button class="cat" data-q="${E(c.replace(' Reports',''))}">
      <span class="gi">${(ICO_FOR_CAT[c]||I.grid)()}</span><span><span class="nm">${E(c)}</span><span class="n">${CATALOG[c].length} reports</span></span></button>`).join('');
    root.querySelectorAll('#v1cats .cat').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;render();});
  }
  function render(){
    const raw = q.value, qs = raw.toLowerCase().trim();
    clr.hidden = !raw;
    if(!qs && activeFacet==='all'){ renderFacets(null); discovery(); return; }
    let hits = INDEX.filter(h => !qs || (h.n+' '+h.cat).toLowerCase().includes(qs));
    if(activeFacet!=='all') hits = hits.filter(h=>h.kind===activeFacet);
    if(qs) hits = hits.map(h=>{const nl=h.n.toLowerCase();return {h,score:nl===qs?3:nl.startsWith(qs)?2:nl.includes(qs)?1:0};}).sort((a,b)=>b.score-a.score).map(x=>x.h);
    const counts = {}; KIND_ORDER.forEach(k=>counts[k]=0);
    (qs?INDEX.filter(h=>(h.n+' '+h.cat).toLowerCase().includes(qs)):INDEX).forEach(h=>counts[h.kind]++);
    counts.all = KIND_ORDER.reduce((a,k)=>a+counts[k],0);
    renderFacets(qs?counts:null);
    if(activeFacet==='dashboard' && (!qs || counts.dashboard===0)){
      resEl.innerHTML = `<div class="empty"><b>No dashboards yet</b><p>Build a custom dashboard by adding reports from computers, hardware, software and custom data.</p>
        <div class="row"><a class="btn primary sm" href="${MODULE}">Create dashboard</a></div></div>`;
      return;
    }
    if(!hits.length){
      resEl.innerHTML = `<div class="empty"><b>No reports match "${E(raw.trim())}"</b><p>Try a different term, or turn this search into something new.</p>
        <div class="row"><a class="btn ghost sm" href="reports-custom-revamp.html">Build a custom report</a><a class="btn primary sm" href="reports-custom-revamp.html">Create a query report</a></div></div>`;
      return;
    }
    const groups = KIND_ORDER.filter(k=>hits.some(h=>h.kind===k));
    resEl.innerHTML = `<div style="font-size:13.5px;font-weight:700;margin-bottom:12px">${hits.length} result${hits.length===1?'':'s'}${qs?` for "${E(raw.trim())}"`:''}</div>` +
      groups.map(k=>{const rows=hits.filter(h=>h.kind===k);return `<div class="hitgroup"><h3>${KIND_LABEL[k]} <span>${rows.length}</span></h3><div class="hits">${rows.map(h=>hitRow(h,qs)).join('')}</div></div>`;}).join('');
  }
  q.oninput = render;
  clr.onclick = ()=>{q.value='';render();q.focus();};
  resEl.addEventListener('click', e=>{ if(e.target.closest('.hit') && !e.target.closest('a') && e.target.closest('.hit').dataset.kind) location.href=MODULE; });
  render();
}

/* ═══════════════════════════ V2 · security analyst / CISO ═══════════════════════════ */
function v2(){
  return `<div class="page">
    <div class="stage">
      <div class="eyebrow" style="color:var(--err)">RISK-FIRST SEARCH</div>
      <h1>Search reports by exposure, not by name</h1>
      <p class="lede">Your open vulnerabilities and the reports that explain them, in one view.</p>
    </div>
    <div class="sevstrip">
      <div class="sv-t">109 open<br>vulnerabilities</div>
      <div class="sevstack">${SEV.map(s=>`<span style="width:${s.v/SEV_TOTAL*100}%;background:${s.c}" title="${s.n}: ${s.v}"></span>`).join('')}</div>
      <div class="sevkeys">${SEV.map(s=>`<div><i style="background:${s.c}"></i>${s.n} <b>${s.v}</b></div>`).join('')}</div>
    </div>
    <div class="bigsearch">
      <div class="bigsearch-in">${I.search()}
        <input id="v2q" placeholder="Search — try “zero-day”, “ransomware”, “patch compliance”…" autocomplete="off">
        <button class="clr" id="v2clr" hidden>${I.x()}</button>
      </div>
    </div>
    <div class="facets" id="v2facets" style="justify-content:center;margin-top:14px"></div>
    <div id="v2results"></div>
  </div>`;
}
function v2Wire(root){
  const SECURITY_CATS = ['Threats & Patches Reports','Malware Protection Reports','Device Control Reports','DLP Reports','BitLocker Reports','Application Control Reports'];
  let activeCat = 'all';
  const q = root.querySelector('#v2q'), clr = root.querySelector('#v2clr');
  const facetsEl = root.querySelector('#v2facets'), resEl = root.querySelector('#v2results');

  function riskFor(cat){
    if(cat==='Threats & Patches Reports') return {tone:'bad', label:`${SEV.find(s=>s.n==='Critical').v+SEV.find(s=>s.n==='Important').v} critical/important open`};
    return null;
  }
  function hitRow(h, qs){
    const risk = h.kind==='predefined' ? riskFor(h.cat) : null;
    const chip = risk ? `<span class="riskchip" style="background:var(--err-bg);color:var(--err)">${I.alert()} ${risk.label}</span>` : '';
    return `<div class="hit" data-kind="${h.kind}">
      <span class="gi">${h.ico()}</span>
      <span class="body"><span class="nm">${highlight(h.n,qs)}</span><span class="meta">${E(h.cat)}</span></span>
      <span class="side">${chip}<div class="act"><a class="btn ghost sm" href="${MODULE}">Preview</a><a class="btn primary sm" href="${MODULE}">Run</a></div></span>
    </div>`;
  }
  function renderFacets(){
    const chips = [{k:'all',l:'All security-relevant'}, ...SECURITY_CATS.map(c=>({k:c,l:c.replace(' Reports','')}))];
    facetsEl.innerHTML = chips.map(c=>`<button class="facet ${activeCat===c.k?'on':''}" data-k="${E(c.k)}">${E(c.l)}</button>`).join('');
    facetsEl.querySelectorAll('.facet').forEach(b=>b.onclick=()=>{activeCat=b.dataset.k;render();});
  }
  function discovery(){
    const exposed = ['Missing Patches','Vulnerable Systems','Highly Vulnerable Systems','Zero Day Vulnerability Report','Detected CVE Summary','Patch Compliance Report'];
    resEl.innerHTML = `
      <div class="disc-sec"><div class="disc-h"><h2>Reports touching your current exposure</h2><div class="sp" style="flex:1"></div>
        <span style="font-size:12px;color:var(--muted)">Ranked by open severity, not alphabet</span></div>
        <div class="hits">${exposed.map(n=>hitRow({n,cat:'Threats & Patches Reports',kind:'predefined',ico:I.shieldCheck},'')).join('')}</div></div>
      <div class="disc-sec"><div class="disc-h"><h2>Browse security categories</h2></div>
        <div class="cgrid" id="v2cats"></div></div>`;
    root.querySelector('#v2cats').innerHTML = SECURITY_CATS.map(c=>`<button class="cat" data-k="${E(c)}">
      <span class="gi">${(ICO_FOR_CAT[c]||I.grid)()}</span><span><span class="nm">${E(c)}</span><span class="n">${CATALOG[c]?CATALOG[c].length:0} reports</span></span></button>`).join('');
    root.querySelectorAll('#v2cats .cat').forEach(b=>b.onclick=()=>{activeCat=b.dataset.k;render();});
  }
  function render(){
    const raw=q.value, qs=raw.toLowerCase().trim();
    clr.hidden = !raw;
    renderFacets();
    if(!qs && activeCat==='all'){ discovery(); return; }
    let hits = INDEX.filter(h => !qs || (h.n+' '+h.cat).toLowerCase().includes(qs));
    if(activeCat!=='all') hits = hits.filter(h=>h.cat===activeCat);
    // security categories always float to the top of a mixed result set
    hits.sort((a,b)=>{
      const as=SECURITY_CATS.includes(a.cat)?0:1, bs=SECURITY_CATS.includes(b.cat)?0:1;
      return as-bs;
    });
    if(!hits.length){ resEl.innerHTML = `<div class="empty"><b>No reports match "${E(raw.trim())}"</b><p>Nothing in the security-relevant catalogue covers this. Try a broader term.</p></div>`; return; }
    resEl.innerHTML = `<div style="font-size:13.5px;font-weight:700;margin-bottom:12px">${hits.length} result${hits.length===1?'':'s'}${qs?` for "${E(raw.trim())}"`:''}</div>
      <div class="hits">${hits.slice(0,60).map(h=>hitRow(h,qs)).join('')}</div>`;
  }
  q.oninput = render;
  clr.onclick=()=>{q.value='';render();q.focus();};
  resEl.addEventListener('click', e=>{ if(e.target.closest('.hit') && !e.target.closest('a')) location.href=MODULE; });
  render();
}

/* ═══════════════════════════ V3 · compliance & audit ═══════════════════════════ */
const COMPLIANCE_TAGS = {
  'License Compliance':['SOC 2'],'Missing Patches':['PCI-DSS','SOC 2'],'Patch Compliance Report':['PCI-DSS','SOC 2'],
  'Bitlocker Details':['HIPAA','PCI-DSS'],'FileVault Details':['HIPAA'],'Disk Encryption':['HIPAA','GDPR'],
  'Antivirus Details':['PCI-DSS'],'Firewall Details':['PCI-DSS'],'Domain Admin User Accounts':['SOC 2','GDPR'],
  'Password Expired User Accounts':['SOC 2'],'Inactive User Accounts':['GDPR','SOC 2'],'Device Audit':['HIPAA'],
  'Justification Summary':['GDPR'],'Compliance report':['PCI-DSS'],'System Compliance Report':['PCI-DSS','SOC 2'],
  'Inventory report':['SOC 2'],
};
function v3(){
  return `<div class="page">
    <div class="stage">
      <div class="eyebrow" style="color:var(--warn)">EVIDENCE SEARCH</div>
      <h1>Find the report that proves a control</h1>
      <p class="lede">Search by framework, and see delivery, retention and export status alongside the name.</p>
    </div>
    <div class="evidence-alert">
      <div class="ico">${I.mail()}</div>
      <div><b>Your one scheduled evidence pack is failing to deliver</b>
        <p>"Inventory report" (Daily → dcsupport@zoho.com) has been failing silently since the mail server became unreachable. This is the report an auditor would ask for first.</p></div>
    </div>
    <div class="bigsearch">
      <div class="bigsearch-in">${I.search()}
        <input id="v3q" placeholder="Search — try “HIPAA”, “retention”, “encryption”…" autocomplete="off">
        <button class="clr" id="v3clr" hidden>${I.x()}</button>
      </div>
    </div>
    <div class="tagrow" id="v3tags" style="justify-content:center"></div>
    <div id="v3results"></div>
  </div>`;
}
function v3Wire(root){
  const FRAMEWORKS = ['All frameworks','HIPAA','GDPR','PCI-DSS','SOC 2'];
  let activeTag = 'All frameworks';
  const q = root.querySelector('#v3q'), clr = root.querySelector('#v3clr');
  const tagsEl = root.querySelector('#v3tags'), resEl = root.querySelector('#v3results');

  function evidenceMeta(h){
    if(h.kind==='schedule') return `<span>${I.mail()} ${E(h.freq||'Daily')} → dcsupport@zoho.com</span><span class="badge bad">Delivery failing</span>`;
    const tags = COMPLIANCE_TAGS[h.n]||[];
    return tags.length ? tags.map(t=>`<span class="badge neu">${E(t)}</span>`).join('') : `<span style="color:var(--faint)">No framework mapped</span>`;
  }
  function hitRow(h, qs){
    return `<div class="hit" data-kind="${h.kind}" style="align-items:flex-start">
      <span class="gi">${h.ico()}</span>
      <span class="body"><span class="nm">${highlight(h.n,qs)}</span><span class="meta">${E(h.cat)}</span>
        <div class="ev-meta">${evidenceMeta(h)}</div></span>
      <span class="side"><div class="act"><a class="btn ghost sm" href="${MODULE}">Open</a></div></span>
    </div>`;
  }
  function renderTags(){
    tagsEl.innerHTML = FRAMEWORKS.map(f=>`<button class="tagchip ${activeTag===f?'on':''}" data-f="${E(f)}">${E(f)}</button>`).join('');
    tagsEl.querySelectorAll('.tagchip').forEach(b=>b.onclick=()=>{activeTag=b.dataset.f;render();});
  }
  function taggedIndex(){
    return INDEX.filter(h => h.kind==='schedule' || (COMPLIANCE_TAGS[h.n]&&COMPLIANCE_TAGS[h.n].length));
  }
  function render(){
    const raw=q.value, qs=raw.toLowerCase().trim();
    clr.hidden = !raw;
    renderTags();
    let pool = taggedIndex();
    if(activeTag!=='All frameworks') pool = pool.filter(h=>h.kind==='schedule' || (COMPLIANCE_TAGS[h.n]||[]).includes(activeTag));
    let hits = pool.filter(h => !qs || (h.n+' '+h.cat+' '+(COMPLIANCE_TAGS[h.n]||[]).join(' ')).toLowerCase().includes(qs));
    if(!hits.length){
      resEl.innerHTML = `<div class="empty"><b>No mapped report matches this</b><p>Nothing tagged for ${activeTag==='All frameworks'?'this search':E(activeTag)} yet. Framework tags here are a curated sample, not the full catalogue.</p></div>`;
      return;
    }
    resEl.innerHTML = `<div style="font-size:13.5px;font-weight:700;margin-bottom:12px">${hits.length} evidence-mapped report${hits.length===1?'':'s'}${qs?` for "${E(raw.trim())}"`:''}</div>
      <div class="hits">${hits.map(h=>hitRow(h,qs)).join('')}</div>
      <div class="note">${I.info()}<div>Framework tags shown here are illustrative — a manually curated mapping for this exploration, not metadata the server exposes today. Real evidence search would need a <code>tags</code> field on each report.</div></div>`;
  }
  q.oninput = render;
  clr.onclick=()=>{q.value='';render();q.focus();};
  resEl.addEventListener('click', e=>{ if(e.target.closest('.hit') && !e.target.closest('a')) location.href=MODULE; });
  render();
}

/* ═══════════════════════════ V4 · power user command palette ═══════════════════════════ */
function v4(){
  return `<div class="page" style="max-width:900px">
    <div class="stage">
      <div class="eyebrow" style="color:var(--violet)">COMMAND PALETTE</div>
      <h1>Type it, filter it, open it</h1>
      <p class="lede">Structured filters — <code>kind:</code>, <code>cat:</code>, <code>status:</code> — plus free text. No mouse required.</p>
    </div>
    <div class="cmdshell"><div class="cmdwrap">
      <div class="cmdin">${I.search()}<input id="v4q" placeholder="kind:custom status:bad  ·  or just start typing…" autocomplete="off" spellcheck="false"></div>
      <div class="cmdlegend">
        <span><b>kind:</b>predefined|custom|query|schedule</span>
        <span><b>cat:</b>&lt;category name&gt;</span>
        <span><b>status:</b>ok|bad</span>
      </div>
      <div class="cmdlist" id="v4list"></div>
      <div class="cmdfoot">
        <span><span class="k">↑↓</span> navigate</span>
        <span><span class="k">↵</span> open</span>
        <span><span class="k">esc</span> clear</span>
        <span style="margin-left:auto" id="v4count"></span>
      </div>
    </div></div>
  </div>`;
}
function v4Wire(root){
  const q = root.querySelector('#v4q'), list = root.querySelector('#v4list'), count = root.querySelector('#v4count');
  let cur = -1;
  function parse(raw){
    const tokens = raw.trim().split(/\s+/).filter(Boolean);
    const filters = {}; const free = [];
    tokens.forEach(t=>{
      const m = t.match(/^(kind|cat|status):(.+)$/i);
      if(m) filters[m[1].toLowerCase()] = m[2].toLowerCase();
      else free.push(t.toLowerCase());
    });
    return {filters, free: free.join(' ')};
  }
  function render(){
    const {filters, free} = parse(q.value);
    let hits = INDEX.slice();
    if(filters.kind) hits = hits.filter(h=>h.kind.startsWith(filters.kind));
    if(filters.cat) hits = hits.filter(h=>h.cat.toLowerCase().includes(filters.cat));
    if(filters.status) hits = hits.filter(h=>(h.status||'').toLowerCase()===filters.status);
    if(free) hits = hits.filter(h=>(h.n+' '+h.cat).toLowerCase().includes(free));
    cur = hits.length ? 0 : -1;
    count.textContent = `${hits.length} / ${INDEX.length}`;
    if(!hits.length){ list.innerHTML = `<div class="cmdempty">No matches. Try <b>kind:custom</b>, <b>cat:patch</b>, or <b>status:bad</b>.</div>`; return; }
    list.innerHTML = hits.slice(0,120).map((h,i)=>`<div class="cmdrow ${i===0?'cur':''}" data-i="${i}">
      <span class="gi">${h.ico()}</span>
      <span class="t">${highlight(h.n,free)}</span>
      <span class="meta">${E(h.kind)}${h.cat?' · '+E(h.cat.split(' · ')[0]):''}</span>
    </div>`).join('');
    list.querySelectorAll('.cmdrow').forEach(el=>el.onclick=()=>location.href=MODULE);
  }
  q.oninput = render;
  root.addEventListener('keydown', e=>{
    const rows = [...list.querySelectorAll('.cmdrow')];
    if(e.key==='Escape'){ q.value=''; render(); return; }
    if(!rows.length) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      cur = e.key==='ArrowDown' ? Math.min(cur+1, rows.length-1) : Math.max(cur-1,0);
      rows.forEach((el,i)=>el.classList.toggle('cur', i===cur));
      rows[cur].scrollIntoView({block:'nearest'});
    }
    if(e.key==='Enter' && cur>=0) rows[cur].click();
  });
  q.focus();
  render();
}

/* ═══════════════════════════ V5 · guided / occasional user ═══════════════════════════ */
const STARTERS = [
  { q:'Are all my computers patched?', matches:['Missing Patches','Patch Compliance Report','System Compliance Report'] },
  { q:'Who has admin access?', matches:['Domain Admin User Accounts','Applications running with Administrator Privileges'] },
  { q:'Show me USB activity', matches:['USB Usage Report','Unauthorized Devices'] },
  { q:'What’s expiring soon?', matches:['Soon-to-Expire User Passwords','Soon to expire Warranty','Soon to expire certificates'] },
];
const PLAIN_DESC = {
  'Missing Patches':'Every endpoint that’s behind on a security patch.',
  'Patch Compliance Report':'How close each endpoint is to fully patched.',
  'System Compliance Report':'A pass/fail view of your patch policy across the estate.',
  'Domain Admin User Accounts':'Everyone with the keys to the whole domain.',
  'Applications running with Administrator Privileges':'Apps running with more power than they should need.',
  'USB Usage Report':'Every USB device plugged in, and when.',
  'Unauthorized Devices':'USB and peripheral devices that were blocked or flagged.',
  'Soon-to-Expire User Passwords':'Accounts about to get locked out — warn them first.',
  'Soon to expire Warranty':'Hardware whose warranty runs out soon.',
  'Soon to expire certificates':'Certificates that need renewing before they break something.',
};
const PLAIN_CATS = [
  { l:'Computers & devices', icoKey:'pc', cats:['Computer Reports','Inventory Reports'] },
  { l:'Users & accounts', icoKey:'user', cats:['User Reports','Group Reports'] },
  { l:'Security & threats', icoKey:'shieldCheck', cats:['Threats & Patches Reports','Malware Protection Reports'] },
  { l:'Mobile & apps', icoKey:'phone', cats:['MDM Reports','Application Control Reports'] },
];
function v5(){
  return `<div class="page">
    <div class="stage">
      <div class="eyebrow" style="color:#8b5cf6">ASK IN YOUR OWN WORDS</div>
      <h1>What are you trying to find out?</h1>
      <p class="lede">No report names to memorize — ask a plain question or pick a category, and we’ll point you at the report that answers it.</p>
      <div class="askbox">
        <div class="bigsearch-in">
          <span class="ask-sparkle">${I.sparkle()}</span>
          <input id="v5q" placeholder="e.g. “are my computers up to date?”" autocomplete="off">
          <button class="clr" id="v5clr" hidden>${I.x()}</button>
        </div>
        <div class="starters" id="v5starters"></div>
      </div>
    </div>
    <div id="v5results"></div>
  </div>`;
}
function v5Wire(root){
  const q = root.querySelector('#v5q'), clr = root.querySelector('#v5clr');
  const startersEl = root.querySelector('#v5starters'), resEl = root.querySelector('#v5results');
  const ICO = {pc:I.pc, user:I.user, shieldCheck:I.shieldCheck, phone:I.phone};

  startersEl.innerHTML = STARTERS.map(s=>`<button class="starter" data-q="${E(s.q)}">${E(s.q)}</button>`).join('');
  startersEl.querySelectorAll('.starter').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;render();});

  function resultCard(name){
    const found = INDEX.find(h=>h.n===name);
    const cat = found ? found.cat : '';
    const ico = found ? found.ico : I.grid;
    return `<div class="rescard">
      <span class="gi">${ico()}</span>
      <span class="body"><span class="nm">${E(name)}</span><span class="d">${E(PLAIN_DESC[name]||cat)}</span></span>
      <a class="btn primary sm" href="${MODULE}">Run it</a>
    </div>`;
  }
  function discovery(){
    resEl.innerHTML = `<div class="disc-sec"><div class="disc-h"><h2>Or browse by topic</h2></div>
      <div class="plaingrid" id="v5cats"></div></div>`;
    root.querySelector('#v5cats').innerHTML = PLAIN_CATS.map(c=>{
      const n = c.cats.reduce((a,cc)=>a+(CATALOG[cc]?CATALOG[cc].length:0),0);
      return `<button class="plaincat" data-cats="${E(c.cats.join('|'))}">
        <span class="gi">${ICO[c.icoKey]()}</span>
        <span class="nm">${E(c.l)}</span><span class="n">${n} reports</span></button>`;
    }).join('');
    root.querySelectorAll('#v5cats .plaincat').forEach(b=>b.onclick=()=>{
      const cats = b.dataset.cats.split('|');
      resEl.innerHTML = `<div class="disc-sec"><div class="disc-h"><h2>${E(b.querySelector('.nm').textContent)}</h2></div>
        ${cats.map(c=>cats.length>1?`<div style="font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px">${E(c)}</div>`:'').join('') || ''}
        ${cats.map(c=>(CATALOG[c]||[]).slice(0,8).map(n=>resultCard(n)).join('')).join('')}
      </div>`;
    });
  }
  function render(){
    const raw=q.value, qs=raw.toLowerCase().trim();
    clr.hidden = !raw;
    if(!qs){ discovery(); return; }
    const starter = STARTERS.find(s=>s.q.toLowerCase()===qs);
    if(starter){
      resEl.innerHTML = `<div class="disc-sec"><div class="disc-h"><h2>Here’s what answers that</h2></div>${starter.matches.map(resultCard).join('')}</div>`;
      return;
    }
    const hits = INDEX.filter(h=>(h.n+' '+h.cat).toLowerCase().includes(qs)).slice(0,8);
    if(!hits.length){
      resEl.innerHTML = `<div class="empty"><b>Nothing matched "${E(raw.trim())}"</b><p>Try rephrasing, or let ZIA build a report from your question instead.</p>
        <div class="row"><a class="btn primary sm" href="reports-custom-revamp.html">${I.sparkle()} Ask ZIA to build this</a></div></div>`;
      return;
    }
    resEl.innerHTML = `<div class="disc-sec"><div class="disc-h"><h2>Closest matches</h2></div>${hits.map(h=>resultCard(h.n)).join('')}</div>`;
  }
  q.oninput = render;
  clr.onclick=()=>{q.value='';render();q.focus();};
  discovery();
}

/* ═════════ mount / switcher ═════════ */
const VARIANTS = [
  { k:'v1', t:'1 · Everyday admin',
    who:'IT Administrator — the primary, generalist user.',
    fix:'Doesn’t know which module a report lives in and wants one box that searches everything, with a friendly landing view (recent, popular, browse) when idle.',
    off:'Treats every user the same — a CISO’s vulnerability hunt gets no more help than an admin poking around.' },
  { k:'v2', t:'2 · Security analyst',
    who:'Security Analyst / CISO.',
    fix:'Frames search by current exposure: severity counts stay visible, facets are threat categories not generic types, and matching reports carry a risk chip instead of just a name.',
    off:'The risk strip is dead weight for anyone not doing triage, and permanently spends vertical space on it.' },
  { k:'v3', t:'3 · Compliance & audit',
    who:'Compliance / Audit.',
    fix:'Searches by framework (HIPAA, GDPR, PCI-DSS, SOC 2) instead of report name, and surfaces delivery/retention status — including the one real schedule that’s failing right now.',
    off:'Framework tags are a hand-curated sample here, not real metadata the server has today — the note under results says so.' },
  { k:'v4', t:'4 · Power user',
    who:'Power user / analyst comfortable with SQL and query reports.',
    fix:'A keyboard-only command palette with typed filter syntax (kind:, cat:, status:) — fast, dense, zero chrome, arrow keys and Enter only.',
    off:'The syntax has to be learned; nothing here explains it to a first-time visitor, and there’s no mouse-friendly fallback.' },
  { k:'v5', t:'5 · Guided search',
    who:'Occasional / self-service user — IT Ops, Finance, or a first-time visitor.',
    fix:'Plain-language questions and topic tiles instead of report jargon; a dead end offers to ask ZIA to build the report instead of just failing.',
    off:'Starter prompts cover a handful of scenarios; anything outside them dead-ends into the same small search box.' },
];
document.getElementById('vtabs').innerHTML = VARIANTS.map((v,i)=>`<button data-v="${v.k}" class="${i===0?'on':''}">${v.t}</button>`).join('');
document.getElementById('views').innerHTML = VARIANTS.map((v,i)=>`<div class="view ${i===0?'on':''}" id="view-${v.k}"></div>`).join('');

const BUILD = {v1,v2,v3,v4,v5};
const WIRE = {v1:v1Wire,v2:v2Wire,v3:v3Wire,v4:v4Wire,v5:v5Wire};
const built = {};
function show(k){
  VARIANTS.forEach(v=>document.getElementById('view-'+v.k).classList.toggle('on', v.k===k));
  document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===k));
  const v = VARIANTS.find(x=>x.k===k);
  document.getElementById('why').innerHTML = `<div class="fix"><b>Built for</b>${v.who} ${v.fix}</div><div><b>Trade-off</b>${v.off}</div>`;
  if(!built[k]){
    const root = document.getElementById('view-'+k);
    root.innerHTML = BUILD[k]();
    WIRE[k](root);
    built[k] = true;
  }
}
document.getElementById('vtabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); });
show('v1');
</script>
