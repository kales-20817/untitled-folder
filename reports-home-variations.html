<meta charset="utf-8">
<title>Reports Home, Five Ways</title>
<style>
  :root{
    --violet:#2563eb; --violet-hov:#1d4ed8; --violet-soft:rgba(37,99,235,.08);
    --surface:#fff; --surface-2:#f4f6fb; --surface-3:#eef2fa; --page:#f7f9fc;
    --border:rgba(37,99,235,.13); --border-soft:rgba(37,99,235,.07);
    --text:#15181e; --muted:#64748b; --faint:#94a3b8;
    --ok:#16a34a; --ok-bg:rgba(34,197,94,.12);
    --warn:#a16207; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.42);
    --err:#dc2626; --err-bg:rgba(239,68,68,.10); --err-line:rgba(239,68,68,.32);
    --sev4:#dc2626; --sev3:#ea580c; --sev2:#ca8a04; --sev1:#0891b2;
    --shadow:0 2px 12px rgba(37,99,235,.06); --pop:0 12px 34px rgba(16,25,42,.14);
    --r:12px; --font:'Zoho Puvi',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --sev4:#f87171; --sev3:#fb923c; --sev2:#facc15; --sev1:#22d3ee;
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --sev4:#f87171; --sev3:#fb923c; --sev2:#facc15; --sev1:#22d3ee;
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button,input,textarea{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .num{font-variant-numeric:tabular-nums}

  /* ══ switcher / pitch chrome ══ */
  .pitch{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border)}
  .pitch-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .pitch-t{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .pitch-t span{color:var(--muted);font-weight:500}
  .vtabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap}
  .vtabs button{padding:6px 12px;border:none;border-radius:7px;background:none;cursor:pointer;
                font:600 12.5px var(--font);color:var(--muted);transition:.14s;white-space:nowrap}
  .vtabs button:hover{color:var(--text)}
  .vtabs button.on{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}
  .why{display:flex;gap:20px;padding:9px 18px 11px;border-top:1px solid var(--border-soft);
       background:var(--surface-2);flex-wrap:wrap;font-size:12.5px;line-height:1.45}
  .why div{max-width:52ch}
  .why b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
         display:block;margin-bottom:2px;font-weight:700}
  .why .fix b{color:var(--violet)}

  .view{display:none}
  .view.on{display:block}

  /* ══ shared primitives ══ */
  .btn{padding:8px 14px;border-radius:8px;font:600 13px/1 var(--font);cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--violet);color:#fff} .btn.primary:hover{background:var(--violet-hov)}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--violet)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn.xs{padding:4px 9px;font-size:11.5px;border-radius:7px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
         font-size:11.5px;font-weight:600;flex-shrink:0;white-space:nowrap}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.bad{background:rgba(239,68,68,.14);color:var(--err)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .badge.acc{background:var(--violet-soft);color:var(--violet)}

  .kbd{font:600 11px var(--font);color:var(--muted);background:var(--surface-2);
       border:1px solid var(--border);border-radius:5px;padding:2.5px 7px;flex-shrink:0}
  .clr{background:none;border:none;color:var(--faint);cursor:pointer;padding:3px;border-radius:6px;line-height:0;flex-shrink:0}
  .clr:hover{color:var(--text);background:var(--surface-2)}
  .sechead{display:flex;align-items:baseline;gap:9px;margin:0 0 10px}
  .sechead h2{font-size:13px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sechead .sub{font-size:12px;color:var(--muted)}
  .sechead .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--violet);cursor:pointer}
  .sechead .more:hover{text-decoration:underline}
  .kindchip{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
            color:var(--faint);flex-shrink:0}

  /* topbar shared by v1/v3/v5 */
  .topbar{display:flex;align-items:center;gap:12px;padding:12px clamp(14px,3vw,28px);
          background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
  .topbar .brand svg{color:var(--violet)}
  .topbar .sp{flex:1}

  /* create menu */
  .createwrap{position:relative}
  .createmenu{position:absolute;right:0;top:calc(100% + 6px);width:270px;background:var(--surface);
              border:1px solid var(--border);border-radius:11px;box-shadow:var(--pop);padding:5px;z-index:60;display:none}
  .createmenu.on{display:block}
  .createmenu button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;border:none;background:none;
                     border-radius:8px;cursor:pointer;align-items:flex-start}
  .createmenu button:hover{background:var(--violet-soft)}
  .createmenu .ci{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;
                  background:var(--surface-2);color:var(--violet);border:1px solid var(--border)}
  .createmenu .cn{display:block;font-size:13px;font-weight:600}
  .createmenu .cd{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}

/* ═════════════════════════════════════════════════════════════
   V1 · ANSWER-FIRST — the page IS the open search panel
   ═════════════════════════════════════════════════════════════ */
  .v1 .wrap{max-width:1000px;margin:0 auto;padding:26px clamp(14px,3vw,28px) 70px}
  .v1 .sb{display:flex;align-items:center;gap:12px;padding:14px 17px;background:var(--surface);
          border:1.5px solid var(--border);border-radius:13px;box-shadow:var(--shadow);transition:.15s}
  .v1 .sb:focus-within{border-color:var(--violet);box-shadow:0 0 0 5px var(--violet-soft)}
  .v1 .sb svg{color:var(--muted);flex-shrink:0}
  .v1 .sb input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:16px}
  .v1 .sb input::placeholder{color:var(--faint)}
  .v1 .facets{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}
  .v1 .facet{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
             color:var(--muted);font:600 12.5px var(--font);cursor:pointer;transition:.13s;display:inline-flex;
             align-items:center;gap:6px}
  .v1 .facet:hover{border-color:var(--violet);color:var(--text)}
  .v1 .facet.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .v1 .facet b{font-weight:700;opacity:.72;font-size:11.5px}

  .v1 .idle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
  @media(max-width:860px){.v1 .idle{grid-template-columns:1fr}}
  .v1 .col h3{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;
              letter-spacing:.06em;margin:0 0 9px}
  .v1 .rs{display:flex;flex-wrap:wrap;gap:6px}
  .v1 .rs button{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
                 font:500 12.5px var(--font);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .v1 .rs button:hover{border-color:var(--violet);color:var(--violet)}
  .v1 .rs button svg{color:var(--faint);width:12px;height:12px}
  .v1 .jb{display:flex;flex-direction:column;gap:1px}
  .v1 .jbr{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;transition:.12s}
  .v1 .jbr:hover{background:var(--violet-soft)}
  .v1 .jbr .gi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;
               background:var(--surface-2);color:var(--muted);border:1px solid var(--border-soft)}
  .v1 .jbr:hover .gi{color:var(--violet);border-color:var(--violet)}
  .v1 .jbr .nm{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v1 .jbr .tm{font-size:11.5px;color:var(--faint);flex-shrink:0}
  .v1 .qq{display:flex;flex-direction:column;gap:6px}
  .v1 .qq button{text-align:left;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
                 background:var(--surface);cursor:pointer;font:500 12.5px/1.4 var(--font);color:var(--text);transition:.13s}
  .v1 .qq button:hover{border-color:var(--violet);background:var(--violet-soft)}
  .v1 .qq button i{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:2px}

  .v1 .grp{margin-bottom:16px}
  .v1 .grp h3{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--faint);
              text-transform:uppercase;letter-spacing:.06em;margin:0 0 7px}
  .v1 .grp h3 em{font-style:normal;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:none;letter-spacing:0}
  .v1 .hits{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
            box-shadow:var(--shadow);overflow:hidden}
  .v1 .hit{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border-soft);
           cursor:pointer;transition:.12s}
  .v1 .hit:last-child{border-bottom:none}
  .v1 .hit:hover{background:var(--violet-soft)}
  .v1 .hit .gi{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
               background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
  .v1 .hit:hover .gi{background:var(--surface);color:var(--violet);border-color:var(--violet)}
  .v1 .hit .body{flex:1;min-width:0;display:block}
  .v1 .hit .nm{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v1 .hit .nm mark{background:none;color:var(--violet);font-weight:700}
  .v1 .hit .meta{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v1 .empty{border:1px dashed var(--border);border-radius:var(--r);padding:30px 22px;text-align:center;background:var(--surface)}
  .v1 .empty b{display:block;font-size:14px;margin-bottom:4px}
  .v1 .empty p{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
  .v1 .allfoot{margin-top:24px;padding-top:16px;border-top:1px solid var(--border-soft);
               display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .v1 .allfoot a{color:var(--violet);font-weight:600;cursor:pointer}
  .v1 .allfoot a:hover{text-decoration:underline}

/* ═════════════════════════════════════════════════════════════
   V2 · OPERATIONS CONSOLE — what needs you, right now
   ═════════════════════════════════════════════════════════════ */
  .v2 .wrap{max-width:1180px;margin:0 auto;padding:20px clamp(14px,3vw,26px) 70px}
  .v2 .hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .v2 .hd h1{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
  .v2 .hd .as{font-size:12.5px;color:var(--muted)}
  .v2 .hd .sp{flex:1}
  .v2 .msearch{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface);
               border:1px solid var(--border);border-radius:9px;min-width:230px}
  .v2 .msearch input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:13px}
  .v2 .msearch svg{color:var(--faint);flex-shrink:0}

  .v2 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
  @media(max-width:900px){.v2 .tiles{grid-template-columns:repeat(2,1fr)}}
  .v2 .tile{padding:13px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
            cursor:pointer;transition:.14s;text-align:left;position:relative;overflow:hidden}
  .v2 .tile:hover{border-color:var(--violet);transform:translateY(-1px);box-shadow:var(--shadow)}
  .v2 .tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint)}
  .v2 .tile.crit::before{background:var(--err)} .v2 .tile.warnb::before{background:var(--warn-line)}
  .v2 .tile.info::before{background:var(--violet)} .v2 .tile.good::before{background:var(--ok)}
  .v2 .tile .v{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .v2 .tile.crit .v{color:var(--err)} .v2 .tile.warnb .v{color:var(--warn)}
  .v2 .tile .l{display:block;font-size:12.5px;font-weight:600;margin-top:2px}
  .v2 .tile .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

  .v2 .split{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
  @media(max-width:960px){.v2 .split{grid-template-columns:1fr}}
  .v2 .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
             box-shadow:var(--shadow);overflow:hidden}
  .v2 .panel > h2{font-size:12.5px;font-weight:700;margin:0;padding:11px 15px;border-bottom:1px solid var(--border-soft);
                  display:flex;align-items:center;gap:8px}
  .v2 .panel > h2 .c{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted)}
  .v2 .arow{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--border-soft);
            transition:.12s;cursor:pointer}
  .v2 .arow:last-child{border-bottom:none}
  .v2 .arow:hover{background:var(--violet-soft)}
  .v2 .arow .sev{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0;background:var(--border)}
  .v2 .arow.e .sev{background:var(--err)} .v2 .arow.w .sev{background:var(--warn-line)}
  .v2 .arow .body{flex:1;min-width:0;display:block}
  .v2 .arow .nm{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v2 .arow .meta{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v2 .arow .act{display:flex;gap:6px;flex-shrink:0;opacity:0;transition:.12s}
  .v2 .arow:hover .act{opacity:1}
  .v2 .feed{display:flex;flex-direction:column}
  .v2 .fr{display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
  .v2 .fr:last-child{border-bottom:none}
  .v2 .fr .gi{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;
              background:var(--surface-2);color:var(--muted);border:1px solid var(--border-soft)}
  .v2 .fr .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v2 .fr .tm{font-size:11px;color:var(--faint);flex-shrink:0}
  .v2 .spin{animation:sp 1.1s linear infinite;transform-origin:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  .v2 .modstrip{margin-top:22px}
  .v2 .mods{display:flex;gap:7px;flex-wrap:wrap}
  .v2 .mods button{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
                   border:1px solid var(--border);background:var(--surface);cursor:pointer;
                   font:600 12.5px var(--font);color:var(--text);transition:.13s}
  .v2 .mods button:hover{border-color:var(--violet);color:var(--violet)}
  .v2 .mods button b{font-weight:700;font-size:11.5px;color:var(--faint)}
  .v2 .mods button:hover b{color:var(--violet)}
  .v2 .note{margin-top:18px;font-size:11.5px;color:var(--faint);line-height:1.5;max-width:78ch}

/* ═════════════════════════════════════════════════════════════
   V3 · MY WORKSPACE — yours first, catalogue second
   ═════════════════════════════════════════════════════════════ */
  .v3 .wrap{max-width:1180px;margin:0 auto;padding:22px clamp(14px,3vw,26px) 70px;
            display:grid;grid-template-columns:1fr 280px;gap:26px;align-items:start}
  @media(max-width:980px){.v3 .wrap{grid-template-columns:1fr}}
  .v3 .greet{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
  .v3 .greetsub{font-size:12.5px;color:var(--muted);margin:0 0 20px}
  .v3 .pins{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:26px}
  @media(max-width:760px){.v3 .pins{grid-template-columns:repeat(2,1fr)}}
  .v3 .pin{padding:13px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
           cursor:pointer;transition:.14s;position:relative;text-align:left}
  .v3 .pin:hover{border-color:var(--violet);box-shadow:var(--shadow);transform:translateY(-1px)}
  .v3 .pin .top{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
  .v3 .pin .gi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
               background:var(--violet-soft);color:var(--violet)}
  .v3 .pin .nm{font-size:13px;font-weight:600;line-height:1.32;flex:1;min-width:0}
  .v3 .pin .unpin{opacity:0;background:none;border:none;cursor:pointer;color:var(--faint);padding:2px;line-height:0}
  .v3 .pin:hover .unpin{opacity:1}
  .v3 .pin .unpin:hover{color:var(--violet)}
  .v3 .pin .val{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .v3 .pin .val.bad{color:var(--err)} .v3 .pin .val.warn{color:var(--warn)}
  .v3 .pin .cap{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .v3 .pin .spark{display:block;margin-top:7px}
  .v3 .addpin{border:1px dashed var(--border);background:none;border-radius:11px;cursor:pointer;
              display:grid;place-items:center;color:var(--faint);gap:5px;font:600 12px var(--font);min-height:106px}
  .v3 .addpin:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
  .v3 .lst{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
           box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}

function wireCreate(root){

function hl(name, q){
  if(!q) return E(name);
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return E(name);
  return E(name.slice(0,i)) + '<mark>' + E(name.slice(i,i+q.length)) + '</mark>' + E(name.slice(i+q.length));
}
const match = (h,q) => (h.n+' '+h.m+' '+KIND[h.k].t).toLowerCase().includes(q.toLowerCase());

function v4Wire(root){
  wireCreate(root);
  const q = root.querySelector('#v4q'), wrap = root.querySelector('#v4wrap'), sEl = root.querySelector('#v4s');
  let surf = 'all';
  const surfaces = [['all','All',TOTAL], ...Object.entries(KIND).map(([k,v])=>[k,v.s,v.n])];
  const drawSurf = () => sEl.innerHTML = surfaces.map(([k,t,n]) =>
    `<button data-k="${k}" class="${k===surf?'on':''}">${t} <b class="num">${n}</b></button>`).join('');

  function render(){
    const term = q.value.trim();
    const pool = INDEX.filter(h => (!term || match(h,term)) && (surf==='all' || h.k===surf));
    if(!pool.length){ wrap.innerHTML = `<div class="none">Nothing in the catalogue matches “${E(term)}”.</div>`; return; }

    const blocks = [];
    // predefined, grouped by module — the block header carries the true module count
    if(surf==='all' || surf==='pre'){
      MODULES.forEach(m=>{
        const rows = pool.filter(h=>h.k==='pre' && h.m===m.n);
        if(!rows.length) return;
        blocks.push(`<div class="blk"><h3><span class="gi">${I[m.i](14)}</span>${E(m.n)}<span class="c num">${m.c}</span></h3>
          <ul>${rows.map(h=>`<li>${hl(h.n,term)}</li>`).join('')}</ul>
          ${!term && rows.length < m.c ? `<div class="rest">+ ${m.c-rows.length} more in ${E(m.n)}</div>` : ''}</div>`);
      });
    }
    // the other four surfaces, one block each
    [['cus','Custom reports'],['qry','Query reports'],['sch','Schedules'],['dsh','Dashboards']].forEach(([k,label])=>{
      if(surf!=='all' && surf!==k) return;
      const rows = pool.filter(h=>h.k===k);
      if(!rows.length) return;
      blocks.push(`<div class="blk"><h3><span class="gi">${kindIcon(k)}</span>${E(label)}<span class="c num">${KIND[k].n}</span></h3>
        <ul>${rows.map(h=>`<li>${hl(h.n,term)}
          ${h.st==='failed'?'<span class="st badge bad"><span class="dot"></span>Failed</span>':''}
          ${h.st==='paused'?'<span class="st badge warn"><span class="dot"></span>Paused</span>':''}
          ${h.w?`<span class="st" style="color:var(--faint);font-size:11px">${h.w}w</span>`:''}</li>`).join('')}</ul>
        ${!term && rows.length < KIND[k].n ? `<div class="rest">+ ${KIND[k].n-rows.length} more</div>` : ''}</div>`);
    });
    wrap.innerHTML = blocks.join('');
  }
  q.oninput = render;
  sEl.onclick = e => { const b = e.target.closest('button'); if(!b) return; surf = b.dataset.k; drawSurf(); render(); };
  drawSurf(); render();
}

        <span class="t">${I.file(12)} ${E(x.a)}</span></button>`).join('')}</div>
      <div class="cat"><h3>Or go straight to a module</h3>
        <div class="row">${MODULES.map(m=>`<button>${I[m.i](14)} ${E(m.n)} <b class="num">${m.c}</b></button>`).join('')}</div></div>`;
  }

  function answer(term){
    const words = term.toLowerCase().split(/\s+/).filter(w=>w.length>3);
    const scored = INDEX.map(h=>{
      const hay = (h.n+' '+h.m).toLowerCase();
      return {h, s: words.reduce((a,w)=>a + (hay.includes(w)?1:0), 0)};
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);

    const found = scored.length ? `<div class="ansec">
        <h3>You may already have this <em>${scored.length} close match${scored.length>1?'es':''}</em></h3>
        ${scored.map(({h})=>`<div class="mc"><span class="gi">${modIcon(h.m)}</span>
          <span class="body"><span class="nm">${E(h.n)}</span>
            <span class="meta">${KIND[h.k].t} · ${E(h.m)}${h.by?' · '+E(h.by):''}</span></span>
          <button class="btn ghost xs">${I.play(12)} Run</button></div>`).join('')}
      </div>` : `<div class="ansec"><h3>Nothing in the catalogue matches</h3>
        <div class="mc" style="cursor:default;color:var(--muted)"><span class="gi" style="background:var(--surface-2);color:var(--faint)">${I.search(15)}</span>
        <span class="body"><span class="nm" style="font-weight:500">No existing report covers this</span>
        <span class="meta">Searched 222 predefined, 37 custom, 56 query, 7 scheduled and 6 dashboards.</span></span></div></div>`;

    body.innerHTML = found + `<div class="ansec"><h3>Or build it ${scored.length?'<em>tailored to exactly what you asked</em>':''}</h3>
      <div class="build">
        <div class="bh">${I.sparkle(16)} ZIA can generate this as a new report</div>
        <p>Here is the specification it would build from your description. Edit anything before it runs.</p>
        <div class="spec">
          <div><b>Data source</b> Patch management · Inventory</div>
          <div><b>Filter</b> ${E(term.slice(0,72))}${term.length>72?'…':''}</div>
          <div><b>Columns</b> Endpoint name, OS, Patch ID, Severity, Status, Last seen</div>
          <div><b>Group by</b> Severity, then endpoint</div>
        </div>
        <div class="brow">
          <button class="btn primary sm">${I.sparkle(14)} Build this report</button>
          <button class="btn ghost sm">${I.dash(14)} Build as dashboard</button>
          <button class="btn ghost sm">${I.ext(14)} Look for an extension</button>
        </div>
      </div></div>`;
  }

  function render(){ const t = q.value.trim(); t ? answer(t) : idle(); }
  q.oninput = render;
  q.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); render(); } };
  root.querySelector('#v5clr').onclick = ()=>{ q.value=''; render(); q.focus(); };
  root.querySelector('#v5go').onclick = render;
  body.addEventListener('click', e=>{ const b = e.target.closest('[data-q]');
    if(b){ q.value = b.dataset.q; render(); q.focus(); } });
  idle();
}

/* ═════════ mount / switcher ═════════ */
const VARIANTS = [
  { k:'v1', t:'1 · Answer-first',
    fix:'The shipped hub has a search box that does nothing until you type, and no visible way to create anything. Here the panel is always open — recent searches, jump-back-in and plain-language questions fill the screen at rest, results replace them as you type, and Create sits in the header.',
    off:'Browsing is demoted to a link. Anyone who wants to wander the catalogue rather than name a thing has to click through first, and the three idle columns are only useful once the tenant has history.' },
  { k:'v2', t:'2 · Operations console',
    fix:'Drops the hero entirely and leads with state: a failed delivery, a paused schedule, 38 predefined reports never run, row counts that moved. Reports become an operational surface you check, not a catalogue you shop.',
    off:'Needs run history, delivery outcomes and row deltas the API does not return today (PRD GAP-6). On a healthy tenant the top half of the page is empty, and it is the wrong first screen for someone who has never run anything.' },
  { k:'v3', t:'3 · My workspace',
    fix:'Answers PRD D8 — 328 items with no personalisation. Pinned reports show their latest number with a 7-run sparkline, then your reports, your queries and your next four deliveries. The catalogue moves to a right rail.',
    off:'Day one is empty, so it lives or dies on the cold-start state (toggle it above the pins). Requires per-user pins, view history and ownership — none of which persist today (GAP-2).' },
  { k:'v4', t:'4 · Catalogue map',
    fix:'No hero, no ranking: all six surfaces on one screen, so the facet counts finally label something you can see. Fixes the shipped page showing module tiles for 222 predefined reports while 106 custom, query, scheduled and dashboard items had no browse path at all.',
    off:'Dense and flat — a directory, not a home page. Nothing tells a first-time admin where to start, and at real enterprise volume the columns need virtualising and per-block paging.' },
  { k:'v5', t:'5 · Ask-first',
    fix:'Turns the search box into a prompt box and removes the dead end: your description is matched against the catalogue first, and whatever it fails to answer becomes a ZIA build spec you can edit. Wires both PRD growth vectors to the entry point.',
    off:'Bets the front door on a capability that is entirely simulated today (GAP-4 — canned responses on a timer). Slower than typing a name you already know, and the build spec is a fixed template here, not generated from what you typed.' },
];
document.getElementById('vtabs').innerHTML = VARIANTS.map((v,i)=>`<button data-v="${v.k}" class="${i===0?'on':''}">${v.t}</button>`).join('');
document.getElementById('views').innerHTML = VARIANTS.map((v,i)=>`<div class="view ${v.k} ${i===0?'on':''}" id="view-${v.k}"></div>`).join('');

const BUILD = {v1,v2,v3,v4,v5};
const WIRE  = {v1:v1Wire,v2:v2Wire,v3:v3Wire,v4:v4Wire,v5:v5Wire};
const built = {};
function show(k){
  VARIANTS.forEach(v=>document.getElementById('view-'+v.k).classList.toggle('on', v.k===k));
  document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===k));
  const v = VARIANTS.find(x=>x.k===k);
  document.getElementById('why').innerHTML =
    `<div class="fix"><b>Fixes</b>${v.fix}</div><div><b>Trade-off</b>${v.off}</div>`;
  if(!built[k]){
    const root = document.getElementById('view-'+k);
    root.innerHTML = BUILD[k]();
    WIRE[k](root);
    built[k] = true;
  }
}
document.getElementById('vtabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); });
show('v1');
</script>
