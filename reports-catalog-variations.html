<meta charset="utf-8">
<title>User Reports, Five Ways</title>
<style>
  :root{
    /* accent + neutrals inherited from the existing Reports explorations */
    --violet:#2563eb; --violet-hov:#1d4ed8; --violet-soft:rgba(37,99,235,.08);
    --surface:#fff; --surface-2:#f4f6fb; --surface-3:#eef2fa; --page:#f7f9fc;
    --border:rgba(37,99,235,.13); --border-soft:rgba(37,99,235,.07);
    --text:#15181e; --muted:#64748b; --faint:#94a3b8;
    --ok:#16a34a; --ok-bg:rgba(34,197,94,.12);
    --warn:#a16207; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.42);
    --err:#dc2626; --err-bg:rgba(239,68,68,.10); --err-line:rgba(239,68,68,.32);
    --shadow:0 2px 12px rgba(37,99,235,.06); --pop:0 12px 34px rgba(16,25,42,.14);
    --r:12px; --font:'Zoho Puvi',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --violet:#3b82f6; --violet-hov:#60a5fa; --violet-soft:rgba(59,130,246,.14);
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#22242f; --page:#0a0a0c;
    --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.36);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.15);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.13); --warn-line:rgba(234,179,8,.34);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.32);
    --shadow:none; --pop:0 12px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button,input,select{font-family:inherit}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .num{font-variant-numeric:tabular-nums}

  /* ══ switcher / pitch chrome ══ */
  .pitch{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border)}
  .pitch-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
  .pitch-t{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .pitch-t span{color:var(--muted);font-weight:500}
  .vtabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap}
  .vtabs button{padding:6px 12px;border:none;border-radius:7px;background:none;cursor:pointer;
                font:600 12.5px var(--font);color:var(--muted);transition:.14s;white-space:nowrap}
  .vtabs button:hover{color:var(--text)}
  .vtabs button.on{background:var(--surface);color:var(--violet);box-shadow:var(--shadow)}
  .why{display:flex;gap:20px;padding:9px 18px 11px;border-top:1px solid var(--border-soft);
       background:var(--surface-2);flex-wrap:wrap;font-size:12.5px;line-height:1.45}
  .why div{max-width:47ch}
  .why b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
         display:block;margin-bottom:2px;font-weight:700}
  .why .fix b{color:var(--violet)}

  /* ══ shared app frame ══ */
  .app{display:flex;min-height:calc(100vh - 96px)}
  .rail{width:62px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
        padding:12px 0;display:flex;flex-direction:column;gap:2px;align-items:center}
  .rail a{width:50px;padding:8px 2px;border-radius:9px;display:grid;justify-items:center;gap:4px;
          text-decoration:none;color:var(--muted);font:600 8.5px/1.25 var(--font);text-align:center}
  .rail a:hover{background:var(--surface-2);color:var(--text)}
  .rail a.on{background:var(--violet-soft);color:var(--violet)}
  .work{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--surface);
          border-bottom:1px solid var(--border)}
  .crumb{font-size:12.5px;color:var(--muted)}
  .crumb b{color:var(--text);font-weight:600}
  .sp{flex:1}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--violet);color:#fff;
          display:grid;place-items:center;font:700 11px var(--font)}

  h1{font-size:20px;font-weight:700;letter-spacing:-.016em;margin:0}
  .sub{font-size:12.5px;color:var(--muted);margin:3px 0 0}

  .btn{padding:7px 13px;border-radius:8px;font:600 12.5px/1 var(--font);cursor:pointer;
       display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;transition:.14s;white-space:nowrap}
  .btn.primary{background:var(--violet);color:#fff}
  .btn.primary:hover{background:var(--violet-hov)}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--violet)}
  .btn.quiet{background:none;color:var(--muted);border-color:transparent}
  .btn.quiet:hover{background:var(--surface-2);color:var(--text)}

  .search{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--surface);
          border:1px solid var(--border);border-radius:9px;min-width:0}
  .search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
  .search svg{color:var(--faint);flex-shrink:0}
  .search input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);font-size:13px}
  .search input::placeholder{color:var(--faint)}
  .kbd{font:600 10.5px var(--font);color:var(--muted);background:var(--surface-2);
       border:1px solid var(--border);border-radius:5px;padding:2px 5px}

  /* type badge */
  .tb{display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1 var(--font);
      padding:4px 7px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
  .tb.table{background:var(--violet-soft);color:var(--violet)}
  .tb.chart{background:var(--ok-bg);color:var(--ok)}
  .tb.kpi{background:var(--warn-bg);color:var(--warn)}
  .ti{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
  .ti.table{background:var(--violet-soft);color:var(--violet)}
  .ti.chart{background:var(--ok-bg);color:var(--ok)}
  .ti.kpi{background:var(--warn-bg);color:var(--warn)}

  .tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)} .tone-err{color:var(--err)}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot.warn{background:var(--warn)} .dot.err{background:var(--err)} .dot.ok{background:var(--ok)}
  .chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font);padding:3px 8px;
        border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .chip.err{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}

  /* category rail (shared by V1/V2/V5) */
  .cats{width:214px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
        padding:14px 10px;overflow-y:auto}
  .cats .lbl{font:700 10px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
             padding:8px 8px 5px}
  .cats a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;text-decoration:none;
          color:var(--text);font-size:12.5px;transition:.13s}
  .cats a:hover{background:var(--surface-2)}
  .cats a.on{background:var(--violet-soft);color:var(--violet);font-weight:600}
  .cats a .c{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .cats a.on .c{color:var(--violet)}

  .view{display:none}
  .view.on{display:block}

  /* ══ V1 · dense catalogue ══ */
  .v1-head{display:flex;align-items:flex-end;gap:14px;padding:18px 22px 0;flex-wrap:wrap}
  .v1-bar{display:flex;align-items:center;gap:10px;padding:14px 22px 12px;flex-wrap:wrap}
  .v1-bar .search{width:290px}
  .segs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px}
  .segs button{border:none;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;
               font:600 11.5px var(--font);color:var(--muted)}
  .segs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .v1-wrap{padding:0 22px 40px;overflow-x:auto}
  table.cat{width:100%;min-width:900px;border-collapse:collapse;background:var(--surface);
            border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  table.cat th{text-align:left;font:700 10.5px var(--font);letter-spacing:.06em;text-transform:uppercase;
               color:var(--faint);padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  table.cat th.r,table.cat td.r{text-align:right}
  table.cat tr.grp td{padding:8px 14px;background:var(--surface-2);border-top:1px solid var(--border);
                      border-bottom:1px solid var(--border-soft);font:700 11.5px var(--font);color:var(--muted)}
  table.cat tr.grp td span{color:var(--faint);font-weight:600;margin-left:7px}
  table.cat td{padding:9px 14px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;white-space:nowrap}
  table.cat td:first-child{white-space:normal}
  table.cat col.c-rec{width:94px} table.cat col.c-sig{width:128px}
  table.cat col.c-last{width:104px} table.cat col.c-sch{width:136px} table.cat col.c-act{width:132px}
  table.cat tbody tr.row:hover{background:var(--violet-soft)}
  table.cat tbody tr.row:hover .acts{opacity:1}
  .nm{display:flex;align-items:center;gap:10px;min-width:0}
  .nm .txt{min-width:0;display:flex;flex-direction:column;gap:1px}
  .nm .t{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm .d{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pin{color:var(--violet);flex-shrink:0}
  .acts{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:.14s}
  .stale{color:var(--faint)}

  /* ══ V2 · split preview ══ */
  .v2{display:flex;min-height:0;flex:1}
  .v2-list{width:322px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
           display:flex;flex-direction:column}
  .v2-list .top{padding:13px 14px;border-bottom:1px solid var(--border)}
  .v2-scroll{overflow-y:auto;max-height:760px;padding:6px 0}
  .v2-g{padding:10px 15px 4px;font:700 10px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .v2-i{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border-left:2px solid transparent}
  .v2-i:hover{background:var(--surface-2)}
  .v2-i.on{background:var(--violet-soft);border-left-color:var(--violet)}
  .v2-i .t{font-size:12.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v2-i.on .t{font-weight:600;color:var(--violet)}
  .v2-pane{flex:1;min-width:0;padding:20px 24px 40px;overflow-x:auto}
  .v2-ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .v2-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;margin:18px 0 20px;
           background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .v2-meta div{background:var(--surface);padding:11px 13px}
  .v2-meta .k{font:700 9.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
  .v2-meta .v{font-size:13px;font-weight:600}
  .prev{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
        box-shadow:var(--shadow);overflow:hidden}
  .prev-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);
          background:var(--surface-2);font:600 11.5px var(--font);color:var(--muted)}
  .prev-b{padding:0;overflow-x:auto}
  table.mini{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  table.mini th{text-align:left;padding:8px 14px;font:700 10.5px var(--font);letter-spacing:.05em;
                text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border)}
  table.mini td{padding:8px 14px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
  table.mini tr:last-child td{border-bottom:none}
  .prev-f{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);
          font-size:11.5px;color:var(--muted);background:var(--surface-2)}
  .bars{display:flex;align-items:flex-end;gap:14px;height:168px;padding:20px 22px}
  .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
  .bars .b i{display:block;width:100%;max-width:54px;border-radius:5px 5px 2px 2px;background:var(--violet);opacity:.85}
  .bars .b em{font:600 10.5px var(--font);color:var(--muted);font-style:normal;text-align:center}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;padding:16px}
  .kpis div{border:1px solid var(--border);border-radius:9px;padding:13px;background:var(--surface-2)}
  .kpis .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .kpis .k{font-size:11.5px;color:var(--muted);margin-top:3px}

  /* ══ V3 · signal cards ══ */
  .v3-head{padding:18px 22px 0;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .v3-bar{display:flex;align-items:center;gap:10px;padding:14px 22px 4px;flex-wrap:wrap}
  .v3-bar .search{width:270px}
  .v3-body{padding:8px 22px 44px}
  .v3-sec{margin-top:22px}
  .v3-sh{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .v3-sh h2{font-size:13.5px;font-weight:700;margin:0;letter-spacing:-.005em}
  .v3-sh .n{font:600 11px var(--font);color:var(--muted);background:var(--surface-2);
            border:1px solid var(--border);padding:1px 8px;border-radius:999px}
  .v3-sh hr{flex:1;border:none;border-top:1px solid var(--border-soft)}
  .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:12px}
  .sc{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      padding:14px 15px 12px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;overflow:hidden}
  .sc:hover{border-color:var(--violet);transform:translateY(-1px);box-shadow:var(--pop)}
  .sc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
  .sc.warn::before{background:var(--warn)} .sc.err::before{background:var(--err)} .sc.ok::before{background:var(--ok)}
  .sc-t{display:flex;align-items:flex-start;gap:9px;margin-bottom:12px}
  .sc-t .t{font-size:13px;font-weight:600;line-height:1.35;flex:1}
  .sc-v{display:flex;align-items:flex-end;gap:10px}
  .sc-v .big{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1}
  .sc-v .unit{font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .sc-v .spark{margin-left:auto;margin-bottom:2px}
  .sc-d{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:6px}
  .sc-f{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;
        border-top:1px solid var(--border-soft);font-size:11px;color:var(--faint)}
  .sc-f .sp{flex:1}
  .sc.empty{border-style:dashed;box-shadow:none}
  .sc.empty .sc-v{color:var(--faint)}

  /* ══ V4 · launcher ══ */
  .v4{padding:44px 22px 60px;max-width:760px;margin:0 auto}
  .v4 .hero{text-align:center;margin-bottom:26px}
  .v4 .hero h1{font-size:26px;margin-bottom:6px}
  .v4 .hero p{font-size:13.5px;color:var(--muted);margin:0}
  .v4-omni{position:relative}
  .v4-omni .search{padding:13px 16px;border-radius:11px;box-shadow:var(--shadow)}
  .v4-omni .search input{font-size:15.5px}
  .v4-res{margin-top:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;
          box-shadow:var(--pop);padding:5px 0;display:none;max-height:330px;overflow-y:auto}
  .v4-res.on{display:block}
  .v4-r{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer}
  .v4-r:hover{background:var(--violet-soft)}
  .v4-r .t{flex:1;font-size:13px;font-weight:500}
  .v4-r .g{font-size:11px;color:var(--muted)}
  .v4-none{padding:20px;text-align:center;color:var(--muted);font-size:13px}
  .v4-sec{margin-top:28px}
  .v4-sh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:700 10.5px var(--font);
         letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .v4-sh .sp{flex:1}
  .v4-sh button{border:none;background:none;color:var(--violet);font:600 11.5px var(--font);cursor:pointer;
                letter-spacing:0;text-transform:none;padding:0}
  .v4-sh button:hover{text-decoration:underline}
  .pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px}
  .pin-c{display:flex;align-items:center;gap:10px;padding:12px 13px;background:var(--surface);
         border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.14s;box-shadow:var(--shadow)}
  .pin-c:hover{border-color:var(--violet)}
  .pin-c .t{font-size:12.5px;font-weight:600;line-height:1.3}
  .pin-c .v{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rows{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
  .rw{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer}
  .rw:last-child{border-bottom:none}
  .rw:hover{background:var(--surface-2)}
  .rw .t{flex:1;font-size:12.5px;font-weight:500}
  .rw .m{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .acc{border:1px solid var(--border);border-radius:11px;background:var(--surface);overflow:hidden}
  .acc details{border-bottom:1px solid var(--border-soft)}
  .acc details:last-child{border-bottom:none}
  .acc summary{padding:10px 14px;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;
               align-items:center;gap:8px;list-style:none}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::after{content:'';margin-left:auto;width:6px;height:6px;border-right:1.6px solid var(--faint);
                      border-bottom:1.6px solid var(--faint);transform:rotate(45deg);transition:.15s}
  .acc details[open] summary::after{transform:rotate(-135deg)}
  .acc summary:hover{background:var(--surface-2)}
  .acc .in{padding:2px 0 8px}
  .acc .in a{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 34px;text-decoration:none;
             color:var(--text);font-size:12.5px}
  .acc .in a:hover{background:var(--surface-2)}
  .acc .in a .m{margin-left:auto;font-size:11px;color:var(--faint)}

  /* ══ V5 · working set ══ */
  .v5-head{padding:18px 20px 0}
  .facets{display:flex;align-items:center;gap:8px;padding:13px 20px;flex-wrap:wrap;
          border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
  .facets .search{width:250px}
  .facets .grp{display:flex;align-items:center;gap:6px}

const fmt = n => n==null ? '—' : n.toLocaleString('en-US');
const spark = (arr,tone) => {
  if(!arr||!arr.length) return '';
  const w=62,h=20,mn=Math.min(...arr),mx=Math.max(...arr),sp=(mx-mn)||1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*w, h-2-((v-mn)/sp)*(h-4)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const col=tone==='err'?'var(--err)':tone==='warn'?'var(--warn)':tone==='ok'?'var(--ok)':'var(--violet)';
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="0,${h} ${line} ${w},${h}" fill="url(#${id})"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2" fill="${col}"/>
  </svg>`;
};
const delta = r => {
  if(!r.sp||r.sp.length<2) return '';

  const up=d>0, bad=(r.tone==='err'||r.tone==='warn')&&up;
  const cls=bad?'tone-err':up?'':'tone-ok';
  return `<span class="${cls}">${up?'▲':'▼'} ${fmt(Math.abs(d))}</span> <span style="color:var(--faint)">vs last week</span>`;
};

    const cols=r.cols.slice(0,5);
    body=`<div class="prev"><div class="prev-h">${I.tableI()} Preview · first 5 of ${fmt(r.v)} rows</div>
      <div class="prev-b"><table class="mini">
        <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${[0,1,2,3,4].map(i=>`<tr>${cols.map(c=>`<td${i===0?' style="font-weight:600"':''}>${(sample[c]||['—','—','—','—','—'])[i]}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div class="prev-f">${r.cols.length} columns available<div class="sp" style="flex:1"></div>Open full report</div></div>`;
  }
  return `<div class="v2-ph">
    <div style="min-width:0">
      <h1 style="font-size:19px">${r.n}</h1>
      <p class="sub">${r.d}</p>
    </div>
    <div class="sp" style="flex:1"></div>
    <span class="tb ${r.t}">${TICON[r.t]} ${TNAME[r.t]}</span>
    ${r.tone?`<span class="chip ${r.tone==='ok'?'':r.tone}"><span class="dot ${r.tone}"></span>${r.tone==='err'?'Needs review':r.tone==='warn'?'Watch':'Healthy'}</span>`:''}
  </div>
  <div class="v2-meta">
    <div><div class="k">Records</div><div class="v num">${r.v==null?'Not run':fmt(r.v)}</div></div>
    <div><div class="k">Last run</div><div class="v">${r.last||'Never'}</div></div>
    <div><div class="k">Schedule</div><div class="v">${r.sched||'Not scheduled'}</div></div>
    <div><div class="k">Group</div><div class="v">${GROUPS[r.g]}</div></div>
    <div><div class="k">Source</div><div class="v">Active Directory</div></div>
  </div>
  ${body}
  <div style="display:flex;gap:9px;margin-top:18px;flex-wrap:wrap">
    <button class="btn primary">${I.play()} Run report</button>
    <button class="btn ghost">${I.cal()} Schedule</button>
    <button class="btn ghost">${I.down()} Export ▾</button>
    <button class="btn ghost">${I.plus()} Add to dashboard</button>
    <div class="sp" style="flex:1"></div>
    <button class="btn quiet">${I.star()} ${r.pin?'Unpin':'Pin'}</button>
  </div>`;
}

/* ═════════ V3 · signal cards ═════════ */
function v3(){
  const card=r=>{
    if(r.v==null) return `<div class="sc empty">
      <div class="sc-t"><span class="ti ${r.t}">${TICON[r.t]}</span><span class="t">${r.n}</span></div>
      <div class="sc-v"><span class="big">—</span><span class="unit">not run yet</span></div>
      <div class="sc-d">${r.d}</div>
      <div class="sc-f">Run once to populate<div class="sp"></div><button class="btn ghost" style="padding:4px 9px;font-size:11px">${I.play()} Run</button></div>
    </div>`;
    return `<div class="sc ${r.tone}">
      <div class="sc-t">
        <span class="ti ${r.t}">${TICON[r.t]}</span>
        <span class="t">${r.n}</span>
        ${r.pin?`<span class="pin">${I.star()}</span>`:''}
      </div>
      <div class="sc-v">
        <span class="big num ${r.tone==='err'?'tone-err':r.tone==='warn'?'tone-warn':''}">${fmt(r.v)}</span>
        <span class="unit">${r.u}</span>
        ${spark(r.sp,r.tone)}
      </div>
      <div class="sc-d">${delta(r)}</div>
      <div class="sc-f">
        ${r.sched?`${I.cal()} ${r.sched}`:`<span style="color:var(--faint)">Not scheduled</span>`}
        <div class="sp"></div>
        <span class="${r.h>168?'':''}">${r.last}</span>
      </div>
    </div>`;
  };
  const attention=R.filter(r=>r.tone==='err'||r.tone==='warn').sort((a,b)=>(a.tone==='err'?0:1)-(b.tone==='err'?0:1));
  return `<div>
    <div class="v3-head">
      <div><h1>User Reports</h1><p class="sub">19 predefined reports · counts cached from each report’s last run</p></div>
      <div class="sp" style="flex:1"></div>
      <button class="btn ghost">${I.down()} Export list</button>
      <button class="btn primary">${I.bolt()} Run all stale</button>
    </div>
    <div class="v3-bar">
      <div class="search">${I.search()}<input placeholder="Search User Reports…"></div>
      <span style="font-size:11.5px;color:var(--faint)">Sort</span>
      <div class="segs"><button class="on">Needs attention</button><button>Category</button><button>Recently run</button><button>A–Z</button></div>
      <div class="sp" style="flex:1"></div>
      <span class="chip err"><span class="dot err"></span>${R.filter(r=>r.tone==='err').length} need review</span>
      <span class="chip warn"><span class="dot warn"></span>${R.filter(r=>r.tone==='warn').length} to watch</span>
    </div>
    <div class="v3-body">
      <div class="v3-sec">
        <div class="v3-sh"><h2>Needs attention</h2><span class="n num">${attention.length}</span><hr>
          <span style="font-size:11.5px;color:var(--muted)">Moved the wrong way this week · each also listed in its own group below</span></div>
        <div class="grid3">${attention.map(card).join('')}</div>
      </div>
      ${GROUPS.map((g,gi)=>{
        const items=R.filter(r=>r.g===gi);
        return `<div class="v3-sec"><div class="v3-sh"><h2>${g}</h2><span class="n num">${items.length}</span><hr></div>
          <div class="grid3">${items.map(card).join('')}</div></div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ═════════ V4 · launcher ═════════ */
function v4(){
  const pins=R.filter(r=>r.pin);
  const recent=[...R].filter(r=>r.v!=null).sort((a,b)=>a.h-b.h).slice(0,4);
  const sched=R.filter(r=>r.sched).slice(0,3);
  return `<div class="v4">
    <div class="hero">
      <h1>What do you need to know about your users?</h1>
      <p>19 predefined User Reports · 266 across the whole catalogue</p>
    </div>
    <div class="v4-omni">
      <div class="search">${I.search()}<input id="v4q" placeholder="Search reports — try “expired”, “admin”, “inactive”…" autocomplete="off"><span class="kbd">⌘K</span></div>
      <div class="v4-res" id="v4res"></div>
    </div>

    <div class="v4-sec">
      <div class="v4-sh">Pinned<div class="sp"></div><button>Edit pins</button></div>
      <div class="pins">${pins.map(r=>`<div class="pin-c">
        <span class="ti ${r.t}">${TICON[r.t]}</span>
        <div><div class="t">${r.n}</div><div class="v"><b class="num ${r.tone==='err'?'tone-err':r.tone==='warn'?'tone-warn':''}">${fmt(r.v)}</b> ${r.u} · ${r.last}</div></div>
      </div>`).join('')}</div>
    </div>

    <div class="v4-sec">
      <div class="v4-sh">Recently run<div class="sp"></div><button>Clear history</button></div>
      <div class="rows">${recent.map(r=>`<div class="rw">
        <span class="ti ${r.t}">${TICON[r.t]}</span>
        <span class="t">${r.n}</span>
        <span class="m num">${fmt(r.v)} ${r.u}</span>
        <span class="m" style="color:var(--faint)">${r.last}</span>
      </div>`).join('')}</div>
    </div>

    <div class="v4-sec">
      <div class="v4-sh">Next scheduled deliveries<div class="sp"></div><button>Manage schedules</button></div>
      <div class="rows">${sched.map(r=>`<div class="rw">
        <span style="color:var(--muted)">${I.cal()}</span>
        <span class="t">${r.n}</span>
        <span class="m">${r.sched}</span>
        <span class="m" style="color:var(--faint)">to 3 recipients</span>
      </div>`).join('')}</div>
    </div>

    <div class="v4-sec">
      <div class="v4-sh">Browse all User Reports<div class="sp"></div><button>Open full catalogue</button></div>
      <div class="acc">${GROUPS.map((g,gi)=>{
        const items=R.filter(r=>r.g===gi);
        return `<details${gi===0?' open':''}><summary>${g} <span class="num" style="color:var(--faint);font-weight:600">${items.length}</span></summary>
          <div class="in">${items.map(r=>`<a href="#">
            <span class="ti ${r.t}">${TICON[r.t]}</span>${r.n}
            <span class="m num">${r.v==null?'not run':fmt(r.v)}</span></a>`).join('')}</div></details>`;
      }).join('')}</div>
    </div>
  </div>`;
}

/* ═════════ V5 · working set ═════════ */
const V5 = {type:'all',fresh:'any',attn:false};
function v5(){
  return `<div style="display:flex;flex:1;min-width:0">${catRail()}
  <div style="flex:1;min-width:0">
    <div class="v5-head">
      <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
        <div><h1>User Reports</h1><p class="sub">Filter the catalogue down to the report you need</p></div>
        <div class="sp" style="flex:1"></div>
        <button class="btn ghost">${I.plus()} New custom report</button>
      </div>
    </div>
    <div class="facets" style="margin-top:14px">
      <div class="search">${I.search()}<input id="v5q" placeholder="Search…"></div>
      <div class="grp"><span>Type</span>
        ${['all','table','chart','kpi'].map(t=>`<button class="fc ${t==='all'?'on':''}" data-f="type" data-v="${t}">${t==='all'?'Any':TNAME[t]}</button>`).join('')}</div>
      <div class="grp"><span>Freshness</span>
        ${[['any','Any'],['today','Today'],['stale','Stale · 7d+']].map(([v,l])=>`<button class="fc ${v==='any'?'on':''}" data-f="fresh" data-v="${v}">${l}</button>`).join('')}</div>
      <button class="fc" data-f="attn" data-v="1">Needs attention only</button>
    </div>
    <div class="v5-body" id="v5body"></div>
  </div></div>`;
}
function v5rows(){
  const q=(document.getElementById('v5q')?.value||'').toLowerCase();
  const hit=R.filter(r=>{
    if(q && !(r.n+' '+r.d).toLowerCase().includes(q)) return false;
    if(V5.type!=='all' && r.t!==V5.type) return false;
    if(V5.fresh==='today' && r.h>24) return false;
    if(V5.fresh==='stale' && r.h<=168) return false;
    if(V5.attn && !(r.tone==='err'||r.tone==='warn')) return false;
    return true;
  });
  const head=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--muted)">
      <span class="num">${hit.length} of 19 reports</span>
      ${hit.length<19?`<span style="color:var(--faint)">·</span><button class="btn quiet" style="padding:3px 8px;font-size:11.5px" id="v5reset">Clear filters</button>`:''}
    </div>`;
  if(!hit.length) return head+`<div class="v5-empty">No report matches these filters. Clear a facet, or <b>create a custom report</b> for this combination.</div>`;
  const body=GROUPS.map((g,gi)=>{
    const items=hit.filter(r=>r.g===gi);
    if(!items.length) return '';
    return `<div class="v5-gh"><h2>${g}</h2><span class="num" style="font-size:11.5px;color:var(--faint)">${items.length}</span><hr></div>
      <div class="grid2">${items.map(r=>`
        <a class="wr" href="#" data-i="${r.i}">
          <span class="ti ${r.t}">${TICON[r.t]}</span>
          <span class="body">
            <span class="t">${r.n}</span>
            <span class="m">
              ${r.tone?`<span class="dot ${r.tone}"></span>`:''}
              ${r.v==null?'Never run':'Last run '+r.last}
            </span>
          </span>
          <span class="val"><span class="v num ${r.tone==='err'?'tone-err':r.tone==='warn'?'tone-warn':''}">${r.v==null?'—':fmt(r.v)}</span><span class="k">${r.u||'not run'}</span></span>
        </a>`).join('')}</div>`;
  }).join('');
  return head+body;
}

/* ═════════ mount ═════════ */
document.getElementById('rail').innerHTML = RAIL.map(([n,k])=>
  `<a href="#" class="${n==='Predefined Report'?'on':''}">${I[k]()}<span>${n}</span></a>`).join('');
document.getElementById('vtabs').innerHTML = VARIANTS.map((v,i)=>
  `<button data-v="${v.k}" class="${i===0?'on':''}">${v.t}</button>`).join('');
document.getElementById('views').innerHTML = VARIANTS.map((v,i)=>
  `<div class="view ${i===0?'on':''}" id="view-${v.k}" style="flex:1;display:${i===0?'flex':'none'};flex-direction:column"></div>`).join('');

const BUILD = {v1,v2,v3,v4,v5};
const built = {};
function show(k){
  VARIANTS.forEach(v=>{
    const el=document.getElementById('view-'+v.k);
    el.style.display = v.k===k?'flex':'none';
  });
  document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===k));
  const v=VARIANTS.find(x=>x.k===k);
  document.getElementById('why').innerHTML =
    `<div class="fix"><b>What it fixes</b>${v.fix}</div><div><b>Trade-off</b>${v.off}</div>`;
  if(!built[k]){ document.getElementById('view-'+k).innerHTML = BUILD[k](); built[k]=1; wire(k); }
}
document.getElementById('vtabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b) show(b.dataset.v);
});

function wire(k){
  const root=document.getElementById('view-'+k);
  if(k==='v2'){
    const pane=root.querySelector('#v2pane');
    const pick=i=>{
      root.querySelectorAll('.v2-i').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
      pane.innerHTML=v2pane(R[i]);
    };
    root.querySelector('#v2list').addEventListener('click',e=>{
      const it=e.target.closest('.v2-i'); if(it) pick(+it.dataset.i);
    });
    root.querySelector('#v2q').addEventListener('input',e=>{
      const q=e.target.value.toLowerCase();
      root.querySelectorAll('.v2-i').forEach(el=>{
        el.style.display = R[+el.dataset.i].n.toLowerCase().includes(q)?'':'none';
      });
    });
    pick(6);
  }
  if(k==='v4'){
    const q=root.querySelector('#v4q'), res=root.querySelector('#v4res');
    q.addEventListener('input',()=>{
      const s=q.value.trim().toLowerCase();
      if(!s){ res.classList.remove('on'); res.innerHTML=''; return; }
      const hit=R.filter(r=>(r.n+' '+r.d+' '+GROUPS[r.g]).toLowerCase().includes(s)).slice(0,7);
      res.innerHTML = hit.length
        ? hit.map(r=>`<div class="v4-r"><span class="ti ${r.t}">${TICON[r.t]}</span>
            <span class="t">${r.n}</span><span class="g">${GROUPS[r.g]}</span>
            <span class="g num" style="min-width:52px;text-align:right">${r.v==null?'not run':fmt(r.v)}</span></div>`).join('')
        : `<div class="v4-none">No predefined report matches “${q.value}”.<br>
             <button class="btn ghost" style="margin-top:11px">Build a custom report instead</button></div>`;
      res.classList.add('on');
    });
  }
  if(k==='v5'){
    const body=root.querySelector('#v5body');
    const render=()=>{ body.innerHTML=v5rows(); };
    render();
    root.querySelector('.facets').addEventListener('click',e=>{
      const b=e.target.closest('.fc'); if(!b) return;
      const f=b.dataset.f;
      if(f==='attn'){ V5.attn=!V5.attn; b.classList.toggle('on',V5.attn); }
      else{
        V5[f]=b.dataset.v;
        root.querySelectorAll(`.fc[data-f="${f}"]`).forEach(x=>x.classList.toggle('on',x===b));
      }
      render();
    });
    root.querySelector('#v5q').addEventListener('input',render);
    body.addEventListener('click',e=>{
      if(e.target.closest('#v5reset')){
        V5.type='all'; V5.fresh='any'; V5.attn=false;
        root.querySelector('#v5q').value='';
        root.querySelectorAll('.fc').forEach(x=>x.classList.toggle('on',x.dataset.v==='all'||x.dataset.v==='any'));
        render();
      }
    });
  }
}
show('v1');
</script>
