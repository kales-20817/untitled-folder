<meta charset="utf-8">
<title>Search Reports, Five More Ways</title>
<style>
  :root{
    --violet:#2563eb; --violet-hov:#1d4ed8; --violet-soft:rgba(37,99,235,.08);
    --surface:#fff; --surface-2:#f4f6fb; --surface-3:#eef2fa; --page:#f7f9fc;
    --border:rgba(15,23,42,.09); --border-soft:rgba(15,23,42,.06); --border-strong:rgba(15,23,42,.16);
    --text:#0f1420; --muted:#5b6472; --faint:#97a1b0;
    --ok:#15803d; --ok-bg:rgba(34,197,94,.12);
    --warn:#a16207; --warn-bg:rgba(234,179,8,.14); --warn-line:rgba(234,179,8,.4);
    --err:#dc2626; --err-bg:rgba(239,68,68,.10); --err-line:rgba(239,68,68,.3);
    --r:16px; --r-sm:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 3px 9px rgba(16,24,40,.05);
    --shadow-lg:0 8px 20px -4px rgba(16,24,40,.10), 0 20px 44px -12px rgba(16,24,40,.12);
    --pop:0 14px 38px rgba(16,25,42,.16);
    --font:'Zoho Puvi',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#20222d; --page:#0a0a0c;
    --border:rgba(255,255,255,.11); --border-soft:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.22);
    --text:rgba(255,255,255,.94); --muted:rgba(255,255,255,.55); --faint:rgba(255,255,255,.38);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.16);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.14); --warn-line:rgba(234,179,8,.32);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 20px 44px rgba(0,0,0,.5); --pop:0 14px 38px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --surface:#12131a; --surface-2:#1a1c25; --surface-3:#20222d; --page:#0a0a0c;
    --border:rgba(255,255,255,.11); --border-soft:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.22);
    --text:rgba(255,255,255,.94); --muted:rgba(255,255,255,.55); --faint:rgba(255,255,255,.38);
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.16);
    --warn:#eab308; --warn-bg:rgba(234,179,8,.14); --warn-line:rgba(234,179,8,.32);
    --err:#f87171; --err-bg:rgba(239,68,68,.13); --err-line:rgba(239,68,68,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 20px 44px rgba(0,0,0,.5); --pop:0 14px 38px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14.5px/1.55 var(--font);-webkit-font-smoothing:antialiased}
  button,input{font-family:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent,var(--violet));outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .num{font-variant-numeric:tabular-nums}
  code{font:11.5px ui-monospace,'SF Mono',Menlo,monospace;background:var(--surface-2);border:1px solid var(--border);
       padding:1px 5px;border-radius:5px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

  @keyframes riseIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .riseIn{animation:riseIn .32s cubic-bezier(.16,1,.3,1) both}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ══ switcher chrome ══ */
  .pitch{position:sticky;top:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border);
         backdrop-filter:saturate(1.1)}
  .pitch-in{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
  .pitch-t{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .pitch-t span{color:var(--muted);font-weight:500}
  .vtabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:10px;flex-wrap:wrap}
  .vtabs button{padding:7px 13px;border:none;border-radius:8px;background:none;cursor:pointer;
                font:600 12.5px var(--font);color:var(--muted);transition:.15s;white-space:nowrap}
  .vtabs button:hover{color:var(--text)}
  .vtabs button.on{background:var(--surface);color:var(--tabaccent,var(--violet));box-shadow:var(--shadow)}
  .why{display:flex;gap:22px;padding:10px 20px 13px;border-top:1px solid var(--border-soft);
       background:var(--surface-2);flex-wrap:wrap;font-size:12.5px;line-height:1.5}
  .why div{max-width:48ch}
  .why b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
         display:block;margin-bottom:3px;font-weight:700}
  .why .fix b{color:var(--tabaccent,var(--violet))}

  .view{display:none}
  .view.on{display:block}

  .btn{padding:9px 16px;border-radius:10px;font:600 13px/1 var(--font);cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;text-decoration:none;
       transition:.15s;white-space:nowrap}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--violet);color:#fff;box-shadow:var(--shadow)} .btn.primary:hover{background:var(--violet-hov)}
  .btn.acc{background:var(--accent,var(--violet));color:#fff;box-shadow:var(--shadow)}
  .btn.acc:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--accent,var(--violet))}
  .btn.sm{padding:7px 12px;font-size:12px}
  .btn.lg{padding:13px 20px;font-size:14.5px;border-radius:12px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;flex-shrink:0}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.bad{background:rgba(239,68,68,.14);color:var(--err)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

  /* ══ shared search-home primitives ══ */
  .page{max-width:900px;margin:0 auto;padding:0 clamp(14px,3vw,30px) 76px;position:relative}
  .stage{text-align:center;padding:52px 0 26px;position:relative}
  .stage-wash{position:absolute;inset:-20px 50% auto 50%;width:900px;height:340px;margin-left:-450px;
              background:radial-gradient(closest-side, color-mix(in srgb, var(--accent,var(--violet)) 16%, transparent), transparent 72%);
              pointer-events:none;z-index:0}
  .stage>*{position:relative;z-index:1}
  .kicker{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:999px;
          background:color-mix(in srgb, var(--accent,var(--violet)) 12%, var(--surface));
          color:var(--accent,var(--violet));font:700 11px var(--font);letter-spacing:.05em;text-transform:uppercase;
          margin-bottom:14px}
  .kicker i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .stage h1{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0 0 9px;text-wrap:balance;line-height:1.15}
  .stage .lede{font-size:14.5px;color:var(--muted);margin:0 auto;max-width:56ch}

  .kbd{font:600 11px var(--font);color:var(--muted);background:var(--surface-2);
       border:1px solid var(--border);border-radius:6px;padding:3px 7px;flex-shrink:0}
  .clr{background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:7px;line-height:0;flex-shrink:0}
  .clr:hover{color:var(--text);background:var(--surface-2)}

  .bigsearch{max-width:640px;margin:0 auto}
  .bigsearch-in{display:flex;align-items:center;gap:12px;padding:16px 19px;background:var(--surface);
           border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);transition:.18s}
  .bigsearch-in:focus-within{border-color:var(--accent,var(--violet));
           box-shadow:0 0 0 5px color-mix(in srgb, var(--accent,var(--violet)) 14%, transparent), var(--shadow-lg)}
  .bigsearch-in svg{color:var(--muted);flex-shrink:0}
  .bigsearch-in input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);font-size:16px}
  .bigsearch-in input::placeholder{color:var(--faint)}

  .facets{display:flex;gap:8px;flex-wrap:wrap}
  .facet{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
         color:var(--muted);font:600 12.5px var(--font);cursor:pointer;transition:.15s;display:inline-flex;
         align-items:center;gap:6px;white-space:nowrap}
  .facet:hover{border-color:var(--accent,var(--violet));color:var(--text)}
  .facet.on{background:var(--accent,var(--violet));border-color:var(--accent,var(--violet));color:#fff;box-shadow:var(--shadow)}

  .hitgroup{margin-bottom:20px}
  .hitgroup h3{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;color:var(--faint);
               text-transform:uppercase;letter-spacing:.06em;margin:0 0 9px}
  .hits{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .hit{display:flex;align-items:center;gap:13px;padding:13px 16px;color:var(--text);
       border-bottom:1px solid var(--border-soft);transition:.14s;cursor:pointer}
  .hit:last-child{border-bottom:none}
  .hit:hover{background:color-mix(in srgb, var(--accent,var(--violet)) 7%, var(--surface))}
  .hit .gi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
           background:var(--surface-2);color:var(--muted);border:1px solid var(--border);transition:.14s}
  .hit:hover .gi{background:var(--surface);color:var(--accent,var(--violet));border-color:var(--accent,var(--violet))}
  .hit .body{flex:1;min-width:0}
  .hit .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit .nm mark{background:none;color:var(--accent,var(--violet));font-weight:700}
  .hit .meta{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit .side{flex-shrink:0;display:flex;align-items:center;gap:8px}

  .empty{padding:44px 22px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--r);color:var(--muted)}
  .empty .ic{width:46px;height:46px;border-radius:50%;background:var(--surface-2);color:var(--faint);
             display:grid;place-items:center;margin:0 auto 14px}
  .empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:6px}
  .empty p{margin:0 0 16px;font-size:13px;max-width:44ch;margin-inline:auto}
  .empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  .disc-sec{margin-bottom:26px}
  .disc-h{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
  .disc-h h2{font-size:13px;font-weight:700;margin:0}
  .disc-h .sp{flex:1}
  .note{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);
        background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--muted);margin-top:24px}
  .note svg{flex-shrink:0;margin-top:1px}

  /* ══ V1 · mobile field technician ══ */
  #view-v1{--accent:#ea580c;--tabaccent:#ea580c}
  .phonewrap{display:flex;justify-content:center;padding:30px 16px 60px;
             background:radial-gradient(circle at 50% 0%, rgba(234,88,12,.10), transparent 60%)}
  .phone{width:380px;max-width:100%;background:var(--surface);border-radius:32px;box-shadow:var(--pop);
         border:8px solid #14161c;overflow:hidden;position:relative}
  .phone-status{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;
                font:700 12px var(--font);color:var(--text)}
  .offline-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--warn-bg);
               color:var(--warn);font:600 11.5px var(--font);border-bottom:1px solid var(--warn-line)}
  .phone-body{padding:16px 16px 4px}
  .m-search{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--surface-2);
            border-radius:14px;border:1px solid var(--border)}
  .m-search:focus-within{border-color:var(--accent);background:var(--surface)}
  .m-search input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--text)}
  .m-search input::placeholder{color:var(--faint)}
  .mic{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:none;
       display:grid;place-items:center;flex-shrink:0;cursor:pointer}
  .mic.listening{animation:pulse 1s ease-in-out infinite}
  .mfacets{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .mfacets::-webkit-scrollbar{display:none}
  .mfacets .facet{flex-shrink:0}
  .mcards{padding:2px 0 16px;display:flex;flex-direction:column;gap:9px;max-height:400px;overflow-y:auto}
  .mcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface-2);
         border:1px solid var(--border);cursor:pointer}
  .mcard .gi{width:38px;height:38px;border-radius:11px;background:var(--surface);color:var(--accent);
             display:grid;place-items:center;flex-shrink:0;border:1px solid var(--border)}
  .mcard .body{flex:1;min-width:0}
  .mcard .nm{font-weight:700;font-size:13.5px}
  .mcard .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
  .mcard .go{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;
             place-items:center;flex-shrink:0}
  .phone-home{height:5px;width:120px;background:var(--border-strong);border-radius:99px;margin:10px auto 12px}

  /* ══ V2 · executive instant answer ══ */
  #view-v2{--accent:#4338ca;--tabaccent:#4338ca}
  .answer-card{max-width:560px;margin:26px auto 0;text-align:center;padding:34px 30px;border-radius:20px;
              background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg)}
  .answer-num{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}
  .answer-unit{font-size:14px;color:var(--muted);margin-top:6px;font-weight:600}
  .answer-delta{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;margin-top:12px;
                padding:4px 11px;border-radius:999px}
  .answer-delta.up{background:var(--err-bg);color:var(--err)} .answer-delta.down{background:var(--ok-bg);color:var(--ok)}
  .answer-src{margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--muted);
              display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .alt-h{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
         text-align:center;margin:26px 0 12px}
  .altrow{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--surface);border:1px solid var(--border);
          border-radius:12px;margin-bottom:8px;cursor:pointer;max-width:560px;margin-inline:auto}
  .altrow:hover{border-color:var(--accent)}
  .altrow .v{font-weight:800;font-size:17px;color:var(--accent);flex-shrink:0;min-width:52px}
  .altrow .t{flex:1;font-size:13px;font-weight:600}
  .exec-suggest{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .exec-suggest button{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
                        font:500 12.5px var(--font);cursor:pointer;box-shadow:var(--shadow)}
  .exec-suggest button:hover{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--surface))}

  /* ══ V3 · IT ops / trend ══ */
  #view-v3{--accent:#0891b2;--tabaccent:#0891b2}
  .oprow{display:flex;align-items:center;gap:14px;padding:13px 16px}
  .fresh-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .fresh-dot.g{background:var(--ok)} .fresh-dot.a{background:var(--warn)} .fresh-dot.r{background:var(--err)}
  .oprow .body{flex:1;min-width:0}
  .oprow .nm{font-size:13.5px;font-weight:600}
  .oprow .meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
  .opspark{flex-shrink:0}

  /* ══ V4 · finance / SAM ══ */
  #view-v4{--accent:#059669;--tabaccent:#059669}
  .exposure-strip{display:flex;align-items:center;gap:20px;padding:16px 18px;border-radius:var(--r);
                  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:22px;
                  flex-wrap:wrap}
  .exposure-strip .big{font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .exposure-strip .lbl{font-size:12px;color:var(--muted)}
  .finrow{display:flex;align-items:center;gap:14px;padding:14px 16px}
  .finrow .body{flex:1;min-width:0}
  .finrow .nm{font-size:13.5px;font-weight:600}
  .finrow .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .util-wrap{display:flex;align-items:center;gap:8px;margin-top:7px}
  .util-bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;max-width:140px}
  .util-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .util-pct{font-size:11px;color:var(--muted);font-weight:700;flex-shrink:0}
  .fin-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
  .fin-amt{font-size:15px;font-weight:800;color:var(--accent)}
  .renew-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .renew-badge.soon{background:var(--warn-bg);color:var(--warn)}
  .renew-badge.late{background:var(--err-bg);color:var(--err)}
  .renew-badge.ok{background:var(--ok-bg);color:var(--ok)}

  /* ══ V5 · accessibility-first ══ */
  #view-v5{--accent:#1d4ed8;--tabaccent:#1d4ed8;font-size:17px}
  #view-v5 .page{max-width:760px}
  #view-v5 .skip{position:absolute;left:16px;top:-48px;padding:10px 16px;background:var(--accent);color:#fff;
                 border-radius:8px;font:700 13px var(--font);text-decoration:none;transition:.15s;z-index:5}
  #view-v5 .skip:focus{top:16px}
  #view-v5 .stage{padding:40px 0 22px;text-align:left}
  #view-v5 .stage-wash{display:none}
  #view-v5 h1{font-size:26px}
  #view-v5 .bigsearch{max-width:none;margin:0}
  #view-v5 .bigsearch-in{border:2px solid var(--border-strong);border-radius:12px;box-shadow:none}
  #view-v5 .bigsearch-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(29,78,216,.18)}
  #view-v5 .hits{border:2px solid var(--border-strong);box-shadow:none;border-radius:12px}
  #view-v5 .hit{border-bottom:2px solid var(--border-soft);padding:16px 18px}
  #view-v5 .hit:hover{background:var(--surface-2)}
  #view-v5 .hit .act{display:flex!important;gap:8px}
  #view-v5 .hit .nm{font-size:15px;text-decoration:underline;text-decoration-color:var(--border-strong);
                     text-underline-offset:3px}
  #view-v5 .hit:hover .nm,#view-v5 .hit:focus-within .nm{text-decoration-color:var(--accent)}
  #view-v5 .facet{border:2px solid var(--border-strong);font-size:13.5px}
  #view-v5 .facet.on{border-color:var(--accent)}
  #view-v5 .a11y-status{padding:10px 14px;border:2px solid var(--border-strong);border-radius:10px;
                        font-size:13.5px;font-weight:700;margin-bottom:16px;background:var(--surface-2)}
</style>

<div class="pitch">
  <div class="pitch-in">
    <div class="pitch-t">Search Reports, five more ways<span> · same index, five different needs</span></div>
    <div class="sp" style="flex:1"></div>
    <div class="vtabs" id="vtabs"></div>
  </div>
  <div class="why" id="why"></div>
</div>

<div id="views"></div>

<script>
function E(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
const MODULE = 'reports-module-revamp.html';
const svg = (p,s=15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {

function highlight(name, q){
  if(!q) return E(name);
  const i = name.toLowerCase().indexOf(q);
  if(i<0) return E(name);
  return E(name.slice(0,i)) + '<mark>' + E(name.slice(i,i+q.length)) + '</mark>' + E(name.slice(i+q.length));
}
function sparkPath(arr,w,h){
  const mn=Math.min(...arr),mx=Math.max(...arr),sp=(mx-mn)||1;
  return arr.map((v,i)=>[i/(arr.length-1)*w, h-1-((v-mn)/sp)*(h-2)]);
}
function spark(arr,color,w=64,h=22){
  const pts = sparkPath(arr,w,h);
  const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="opspark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

    </div>
    <div class="a11y-status" id="v5status" role="status" aria-live="polite">Showing all predefined reports.</div>
    <div id="v5results" tabindex="-1"></div>
  </div>`;
}
function v5Wire(root){
  const CATS = ['All', ...Object.keys(CATALOG)];
  let active='All';
  const q=root.querySelector('#v5q'), clr=root.querySelector('#v5clr');
  const facetsEl=root.querySelector('#v5facets'), resEl=root.querySelector('#v5results'), status=root.querySelector('#v5status');
  function renderFacets(){
    facetsEl.innerHTML = CATS.map(c=>`<button class="facet ${active===c?'on':''}" data-c="${E(c)}">${E(c)}</button>`).join('');
    facetsEl.querySelectorAll('.facet').forEach(b=>b.onclick=()=>{active=b.dataset.c;render();b.focus();});
  }
  function row(h,qs){
    return `<div class="hit" data-n="${E(h.n)}">
      <span class="gi">${h.ico()}</span>
      <span class="body"><span class="nm">${highlight(h.n,qs)}</span><span class="meta">${E(h.cat)}</span></span>
      <span class="act"><a class="btn ghost sm" href="${MODULE}">Preview report</a><a class="btn acc sm" href="${MODULE}">Run report</a></span>
    </div>`;
  }
  function render(){
    const raw=q.value, qs=raw.toLowerCase().trim();
    clr.hidden=!raw;
    renderFacets();
    let hits = INDEX.filter(h=>active==='All'||h.cat===active);
    if(qs) hits = hits.filter(h=>(h.n+' '+h.cat).toLowerCase().includes(qs));
    status.textContent = qs || active!=='All'
      ? `${hits.length} result${hits.length===1?'':'s'} found${qs?` for "${raw.trim()}"`:''}${active!=='All'?` in ${active}`:''}.`
      : `Showing all ${hits.length} predefined reports.`;
    if(!hits.length){
      resEl.innerHTML = `<div class="empty"><div class="ic">${I.search()}</div><b>No results found</b>
        <p>Try a different search term, or choose "All" to clear the category filter.</p></div>`;
      return;
    }
    resEl.innerHTML = `<div class="hits">${hits.slice(0,80).map(h=>row(h,qs)).join('')}</div>`;
  }
  q.oninput = render;
  clr.onclick = ()=>{q.value='';render();q.focus();};
  render();
}

const VARIANTS = [
  { k:'v1', t:'1 · Field technician',
    who:'On-site technician on a phone, gloves on, connectivity spotty.',
    fix:'Thumb-reach search bar, oversized tap targets, a voice-search button, and a visible "cached results" banner so a dropped connection doesn’t look like a broken app.',
    off:'Deliberately shows far less per result than a desktop view — no metadata that doesn’t fit a 380px screen makes it in.' },
  { k:'v2', t:'2 · Executive answer',
    who:'Manager or executive who wants the number, not the report.',
    fix:'Search returns a single big answer first — value, trend, source — with the underlying report one click away. Only falls back to a report list when there’s no canned answer.',
    off:'Only a handful of questions have a real canned answer here; everything else quietly degrades to a plain list, which can feel inconsistent.' },
  { k:'v3', t:'3 · Ops & trend',
    who:'IT Operations — cares about freshness and trend, not just a name match.',
    fix:'Every row carries a freshness dot, a 7-point sparkline and its schedule, sorted freshest-first — you can judge a report before opening it.',
    off:'Trend and freshness data has to be computed and cached per report; this view assumes that pipeline exists.' },
  { k:'v4', t:'4 · Finance / SAM',
    who:'Finance or Software Asset Management — thinks in dollars, not report names.',
    fix:'A running exposure total up top, results ranked by $ impact by default, with utilization bars and renewal countdowns inline.',
    off:'Dollar figures and utilization are illustrative for this exploration — real ones need a costing model wired to license and warranty data.' },
  { k:'v5', t:'5 · Accessibility-first',
    who:'A user relying on a screen reader, keyboard-only input, or low vision.',
    fix:'2px high-contrast borders, a skip link, always-visible labelled action buttons (no hover-only affordances), and a live region that announces result counts as you type.',
    off:'The larger type and always-visible actions cost density — this view fits roughly half as many results per screen as the others.' },
];
document.getElementById('vtabs').innerHTML = VARIANTS.map((v,i)=>`<button data-v="${v.k}" class="${i===0?'on':''}">${v.t}</button>`).join('');
document.getElementById('views').innerHTML = VARIANTS.map((v,i)=>`<div class="view ${i===0?'on':''}" id="view-${v.k}"></div>`).join('');

const ACCENT = {v1:'#ea580c', v2:'#4338ca', v3:'#0891b2', v4:'#059669', v5:'#1d4ed8'};
const BUILD = {v1,v2,v3,v4,v5};
const WIRE = {v1:v1Wire,v2:v2Wire,v3:v3Wire,v4:v4Wire,v5:v5Wire};
const built = {};
function show(k){
  VARIANTS.forEach(v=>document.getElementById('view-'+v.k).classList.toggle('on', v.k===k));
  document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===k));
  document.documentElement.style.setProperty('--tabaccent', ACCENT[k]);
  const v = VARIANTS.find(x=>x.k===k);
  document.getElementById('why').innerHTML = `<div class="fix"><b>Built for</b>${v.who} ${v.fix}</div><div><b>Trade-off</b>${v.off}</div>`;
  if(!built[k]){
    const root = document.getElementById('view-'+k);
    root.innerHTML = BUILD[k]();
    WIRE[k](root);
    built[k] = true;
  }
}
document.getElementById('vtabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); });
show('v1');
</script>
